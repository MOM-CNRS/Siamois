[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siamois-sdk"
version = "0.2.0"
description = "Client Python pour l'API REST SIAMOIS (/api/v1)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.25"]
license = { text = "See repository LICENSE" }

[tool.setuptools.packages.find]
include = ["siamois_sdk*"]
