<!-- /pages/shared/table/entityTable.xhtml -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:siaInplace="http://xmlns.jcp.org/jsf/composite/pages/shared/inplace"
                xmlns:cc="http://xmlns.jcp.org/jsf/composite">

    <cc:interface>
        <cc:attribute name="tableModel" required="true" type="fr.siamois.ui.table.viewmodel.EntityTableViewModel"/>
        <cc:attribute name="panelIndex" required="true" type="java.lang.String"/>
        <cc:attribute name="tableClass" required="false" default="siamois-unit-table" type="java.lang.String"/>
        <cc:facet name="rightToolbar"/>
    </cc:interface>

    <cc:implementation>
        <p:outputPanel id="tableContainer">

            <!-- DataTable -->
            <ui:include src="/pages/shared/table/entityDataTable.xhtml">
                <ui:param name="tableModel" value="#{cc.attrs.tableModel}" />
                <ui:param name="panelId" value="#{panelIndex}"/>
                <ui:param name="panelIndex" value="#{cc.attrs.panelIndex}" />
                <ui:param name="tableClass" value="#{cc.attrs.tableClass}" />
                <ui:param name="updateTableString" value="#{cc.clientId}:entityDatatable" />
            </ui:include>

            <!-- TreeTable -->
            <ui:include src="/pages/shared/table/entityTreeTable.xhtml">
                <ui:param name="tableModel" value="#{cc.attrs.tableModel}" />
                <ui:param name="panelId" value="#{panelIndex}"/>
                <ui:param name="panelIndex" value="#{cc.attrs.panelIndex}" />
                <ui:param name="tableClass" value="#{cc.attrs.tableClass}" />
                <ui:param name="updateTableString" value="#{cc.clientId}:entityTreeTable" />
            </ui:include>
        </p:outputPanel>

        <p:blockUI block="tableContainer"  widgetVar="#{cc.clientId}_buiTables">
            <i class="pi pi-spin pi-spinner" style="font-size: 3rem"/>
        </p:blockUI>

        <!--
            Single shared cell-edit overlay for the whole table (list AND tree mode share this one
            instance, tableModel.activeCellItemId/activeCellColumn is shared state regardless of
            which is showing). See fieldCore.xhtml's isOptimizedLightType cells, which open this
            instead of rendering their own inline edit widget — so the table builds one edit widget
            total, not one per row. Content is resolved from tableModel's active-cell state, not
            from a loop variable, since this lives outside both tables' row loops.
        -->
        <p:overlayPanel id="cellEditOverlay" widgetVar="#{cc.clientId}_cellEditOverlay"
                        for="#{cc.clientId}:tableContainer"
                        showEvent="none" hideEvent="none" dismissable="true"
                        appendTo="@(body)" styleClass="rum-overlay recording-unit sia-cell-edit-overlay"
                        onHide="siaOnCellOverlayHide('#{cc.clientId}')">

            <ui:param name="activeColumn" value="#{cc.attrs.tableModel.activeCellColumn}"/>
            <ui:param name="activeItem" value="#{cc.attrs.tableModel.getActiveCellItem()}"/>

            <h:panelGroup rendered="#{activeColumn ne null and activeItem ne null}">
                <ui:param name="rowContext" value="#{cc.attrs.tableModel.getRowContext(activeItem)}"/>
                <ui:param name="answer" value="#{rowContext.getFieldAnswer(activeColumn.field)}"/>
                <ui:param name="hasBeenModified" value="#{answer ne null and answer.hasBeenModified}"/>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldText'}">
                    <siaInplace:text id="ovText"
                                     field="#{activeColumn.field}"
                                     required="#{activeColumn.required}"
                                     label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                     hasBeenModified="#{hasBeenModified}"
                                     answer="#{answer}"
                                     mode="input"
                                     updateTargetsOnBlur="@this"
                                     onModified="#{rowContext.onFieldAnswerModifiedListener}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectOneFromFieldCode'
                           or activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultipleFromFieldCode'
                           or activeColumn.field['class'].simpleName eq 'CustomFieldSelectOne'
                           or activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultiple'}">
                    <siaInplace:concept id="ovConcept"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        multiple="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultipleFromFieldCode' or activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultiple'}"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        mode="input"
                                        updateTargetsOnBlur="@this"
                                        answer="#{answer}"
                                        onConceptChanged="#{rowContext.setFieldConceptAnswerHasBeenModified}"
                                        dependsOnBaseConcept="#{rowContext.getDependsOnBaseConcept(activeColumn.field)}"
                                        formCtx="#{rowContext}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultipleRecordingUnit'
                           or activeColumn.field['class'].simpleName eq 'CustomFieldSelectOneRecordingUnit'}">
                    <siaInplace:recordingUnitMultiple id="ovRecordingUnit"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        formCtx="#{rowContext}"
                                        multiple="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultipleRecordingUnit'}"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        mode="input"
                                        compact="false"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        spatialUnitOptions="#{rowContext.getSpatialUnitOptions()}"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldInteger'}">
                    <siaInplace:integer id="ovInteger"
                                        panelModel="#{rowContext}"
                                        field="#{activeColumn.field}"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        hasBeenModified="#{hasBeenModified}"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        answer="#{answer}"
                                        mode="input"
                                        updateTargetsOnBlur="@this"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldDecimal'}">
                    <siaInplace:decimal id="ovDecimal"
                                        panelModel="#{rowContext}"
                                        field="#{activeColumn.field}"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        hasBeenModified="#{hasBeenModified}"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        answer="#{answer}"
                                        mode="input"
                                        updateTargetsOnBlur="@this"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldDateTime'}">
                    <siaInplace:datePicker id="ovDatePicker"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        field="#{activeColumn.field}"
                                        hasBeenModified="#{hasBeenModified}"
                                        answer="#{answer}"
                                        mode="input"
                                        updateTargetsOnBlur="@this"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"/>
                </c:if>

                <!-- Not user-editable — same read-only link as the light cell and its full 'output' mode -->
                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectOneActionUnit'}">
                    <siaInplace:action id="ovAction"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        mode="input"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        updateTargetsOnBlur="@this"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectOneSpatialUnit'}">
                    <siaInplace:spatial id="ovSpatial"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        formCtx="#{rowContext}"
                                        mode="input"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        spatialUnitOptions="#{rowContext.getSpatialUnitOptions()}"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectOnePerson'}">
                    <siaInplace:person id="ovOnePerson"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        mode="input"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultiplePerson'}">
                    <siaInplace:person id="ovMultiplePerson"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        multiple="true"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        mode="input"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultipleContainer'}">
                    <siaInplace:containerMultiple id="ovContainerMultiple"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        formCtx="#{rowContext}"
                                        multiple="true"
                                        mode="input"
                                        compact="false"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultiplePhase'}">
                    <siaInplace:phaseMultiple id="ovPhaseMultiple"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        formCtx="#{rowContext}"
                                        multiple="true"
                                        mode="input"
                                        compact="false"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultipleSpatialUnitTree'}">
                    <siaInplace:spatialMultiple id="ovSpatialMultiple"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        formCtx="#{rowContext}"
                                        multiple="true"
                                        mode="input"
                                        compact="false"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        spatialUnitOptions="#{rowContext.getSpatialUnitOptions()}"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectMultipleSpecimen'}">
                    <siaInplace:specimen id="ovSpecimen"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        formCtx="#{rowContext}"
                                        multiple="true"
                                        mode="input"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        spatialUnitOptions="#{rowContext.getSpatialUnitOptions()}"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectOneActionCode'}">
                    <siaInplace:actionCode id="ovActionCode"
                                        field="#{activeColumn.field}"
                                        required="#{activeColumn.required}"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        hasBeenModified="#{hasBeenModified}"
                                        answer="#{answer}"
                                        mode="input"
                                        updateTargetsOnBlur="@this"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldSelectOneAddress'}">
                    <siaInplace:address id="ovAddress"
                                        formCtx="#{rowContext}"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        mode="input"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        required="#{activeColumn.required}"
                                        answer="#{answer}"/>
                </c:if>

                <c:if test="#{activeColumn.field['class'].simpleName eq 'CustomFieldMeasurement'}">
                    <siaInplace:measurement id="ovMeasurement"
                                        formCtx="#{rowContext}"
                                        hasBeenModified="#{hasBeenModified}"
                                        field="#{activeColumn.field}"
                                        mode="input"
                                        label="#{spatialUnitFieldBean.resolveCustomFieldLabel(activeColumn.field)}"
                                        onModified="#{rowContext.onFieldAnswerModifiedListener}"
                                        updateTargetsOnBlur="@this"
                                        required="#{activeColumn.required}"
                                        answer="#{answer}"/>
                </c:if>
            </h:panelGroup>
        </p:overlayPanel>
    </cc:implementation>
</ui:composition>
