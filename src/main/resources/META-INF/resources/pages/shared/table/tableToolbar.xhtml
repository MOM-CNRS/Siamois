<!-- /resources/components/tableToolbar.xhtml -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
>

    <!--@elvariable id="tableModel" type="fr.siamois.ui.table.viewmodel.EntityTableViewModel"-->

    <p:toolbar id="tableToolbar">
        <p:toolbarGroup>
            <p:toolbarGroup align="left">
                <div style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 1em; align-items: center;">


                    <p:commandButton
                            type="button"
                            id="tableParam"
                            styleClass="rounded-button ui-button-flat"
                            icon="bi bi-gear"
                    />
                    <p:overlayPanel for="tableParam" widgetVar="#{cc.clientId}_gearOverlay">
                        <div style="display: flex;
    flex-direction: column;
    gap: 1em;">
                            <!-- Toggle Switch -->
                            <div style="display: flex; gap:1em; align-items: center">
                                <p:toggleSwitch
                                        rendered="#{tableModel.isSwitchVisible()}"
                                        value="#{tableModel.treeMode}"
                                        onIcon="bi bi-list-nested"
                                        offIcon="bi bi-list">
                                    <p:ajax process="@this"
                                            update=":#{cc.clientId}:tableContainer, #{tableModel.parentPanel.actionToolbarId}"
                                            listener="#{tableModel.onSwitchTreeMode}"
                                            onstart="PF('#{cc.clientId}_buiTables').show()"
                                            oncomplete="PF('#{cc.clientId}_buiTables').hide(); PF('#{cc.clientId}_gearOverlay').show();"/>

                                </p:toggleSwitch>
                                <span>#{tableModel.treeMode ? 'Mode Arborescence' : 'Mode Liste'}</span>
                            </div>

                            <!-- Column Toggler -->
                            <p:commandButton
                                    id="toggler" type="button"
                                    value="#{langBean.msg('table.columnvisibility')}"
                                    icon="pi pi-align-justify"/>
                            <p:columnToggler
                                    datasource=":#{cc.clientId}:#{tableId}"
                                    trigger=":#{cc.clientId}:#{tableId}:toggler">
                                <p:ajax event="toggle"
                                        update="#{tableModel.parentPanel.actionToolbarId}"
                                        listener="#{cc.attrs.tableModel.onToggle}"
                                        oncomplete="PF('#{cc.clientId}_gearOverlay').show();"/>
                            </p:columnToggler>
                        </div>
                    </p:overlayPanel>

                    <!-- Global Search -->
                    <span class="filter-container ui-input-icon-left">
                        <i class="bi bi-search"/>
                        <p:inputText id="globalFilter"
                                     value="#{tableModel.globalFilter}"
                                     onkeyup="PrimeFaces.debounce(() => PF('#{cc.clientId}_#{tableId}').filter(), 500)"
                                     placeholder="#{langBean.msg('common.action.search')}"
                                     disabled="true"
                        />
                    </span>

                    <!-- Filter bar: Notion-style opt-in filter chips, replacing per-column header filters -->
                    <h:panelGroup id="filterBar" layout="block" style="display: flex; flex-wrap: wrap; gap: 0.5em; align-items: center;">

                        <p:commandButton
                                type="button"
                                id="addFilterBtn"
                                styleClass="ui-button-flat"
                                icon="pi pi-filter"
                                value="#{langBean.msg('common.action.addFilter')}"
                                rendered="#{not empty tableModel.getAvailableFilterColumns()}"
                        />
                        <p:overlayPanel for="addFilterBtn" widgetVar="#{cc.clientId}_addFilterOverlay" dismissable="true">
                            <ul class="sia-filter-column-picker">
                                <c:forEach var="pickColumn" items="#{tableModel.getAvailableFilterColumns()}">
                                    <li>
                                        <p:commandLink value="#{langBean.resolveMessage(pickColumn.headerKey)}"
                                                       process="@this"
                                                       action="#{tableModel.addFilterColumn(pickColumn)}"
                                                       update=":#{cc.clientId}:#{tableId}:filterBar"
                                                       oncomplete="PF('#{cc.clientId}_addFilterOverlay').hide();"/>
                                    </li>
                                </c:forEach>
                            </ul>
                        </p:overlayPanel>

                        <c:forEach var="filterColumn" items="#{tableModel.activeFilterColumns}" varStatus="chipStatus">
                            <span class="sia-filter-chip">
                                <p:commandButton type="button"
                                                 id="filterChipBtn_#{chipStatus.index}"
                                                 styleClass="ui-button-flat sia-filter-chip-btn"
                                                 value="#{langBean.resolveMessage(filterColumn.headerKey)}"
                                                 icon="pi pi-filter"/>
                                <p:commandButton type="button"
                                                 id="removeFilterChipBtn_#{chipStatus.index}"
                                                 styleClass="ui-button-flat sia-filter-chip-remove"
                                                 icon="pi pi-times"
                                                 process="@this"
                                                 action="#{tableModel.removeFilterColumn(filterColumn)}"
                                                 update=":#{cc.clientId}:#{tableId}:filterBar, #{tableModel.parentPanel.actionToolbarId}"
                                                 oncomplete="PF('#{cc.clientId}_#{tableId}').filter();"/>
                                <p:overlayPanel for="filterChipBtn_#{chipStatus.index}" dismissable="true" styleClass="sia-filter-chip-overlay">
                                    <ui:include src="/pages/shared/table/filterBarWidget.xhtml">
                                        <ui:param name="tableModel" value="#{tableModel}"/>
                                        <ui:param name="column" value="#{filterColumn}"/>
                                    </ui:include>
                                </p:overlayPanel>
                            </span>
                        </c:forEach>

                    </h:panelGroup>

                </div>
            </p:toolbarGroup>
        </p:toolbarGroup>

        <p:toolbarGroup align="right">
            <p:commandButton
                    value="#{langBean.msg('common.action.create')}"
                    rendered="#{not empty tableModel.toolbarCreateConfig and flowBean.isWriteMode and tableModel.toolbarCreateConfig.createAllowedSupplier.asBoolean}"
                    icon="bi bi-plus-square"
                    immediate="true"
                    action="#{tableModel.openCreateFromToolbar(genericNewUnitDialogBean,
                    cc.clientId.concat(':tableContainer'),
                    cc.clientId.concat('_').concat(tableId)
                    )}"
                    oncomplete="PF('newUnitDiag').show();"
                    update="newUnitForm"
            >
            </p:commandButton>

            <h:panelGroup rendered="#{not empty tableModel.toolbarCreateConfig
                    and flowBean.isWriteMode
                    and not tableModel.toolbarCreateConfig.createAllowedSupplier.asBoolean
                    and not empty tableModel.toolbarCreateConfig.unavailableMessageKeySupplier.get()}">
                #{langBean.msg(tableModel.toolbarCreateConfig.unavailableMessageKeySupplier.get())}&#160;<p:commandLink value="#{langBean.msg(tableModel.toolbarCreateConfig.unavailableLinkLabelKeySupplier.get())}"
                               action="#{tableModel.onToolbarCreateUnavailableLinkClick()}"
                               ajax="false"/>
            </h:panelGroup>
        </p:toolbarGroup>
    </p:toolbar>
</ui:composition>
