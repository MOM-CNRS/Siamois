<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:blockUI block="flow" widgetVar="buiContent">
        <i class="pi pi-spin pi-spinner" style="font-size: 3rem"/>
    </p:blockUI>

    <ui:include src="/dialog/snake/snakeGameDialog.xhtml"/>
    <ui:include src="/dialog/document/bulkDocumentImport.xhtml"/>

    <!-- Opened from React documents tabs (window.siaOpenBulkDocumentImport). -->
    <h:form id="siaBulkDocOpenForm">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
        <p:remoteCommand name="siaOpenBulkDocumentImport"
                         action="#{documentBulkImportBean.openFromRemote}"
                         process="@this"
                         global="false"/>
    </h:form>

</ui:composition>
