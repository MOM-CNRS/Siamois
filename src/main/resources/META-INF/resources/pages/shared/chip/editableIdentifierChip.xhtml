<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:cc="http://java.sun.com/jsf/composite"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
>

    <!--
        Read/edit toggle for an entity's identifying chip in a panel header: plain chip in read
        mode, turning into an input (Enter/Escape trigger the shared header edit button's
        apply/cancel) when the panel is in edit mode. Entering/leaving edit mode and its
        apply/cancel actions are driven from outside this composite (one shared edit button per
        header, placed after the category chip) — this component only renders the identifier
        half of that shared edit session and holds no state of its own beyond what the panel
        bean (which must extend AbstractSingleEntityPanel) exposes via editingIdentifier /
        editingIdentifierValue.
    -->
    <cc:interface>
        <cc:attribute name="panel"
                      shortDescription="The panel bean, extending AbstractSingleEntityPanel"
                      required="true"/>
        <cc:attribute name="value"
                      type="java.lang.String"
                      shortDescription="The identifying value to show in read mode"
                      required="true"/>
        <cc:attribute name="styleClass"
                      type="java.lang.String"
                      shortDescription="Style class applied to the chip in read mode"
                      required="false"/>
        <cc:attribute name="icon"
                      type="java.lang.String"
                      shortDescription="Bootstrap icon class for the chip"
                      required="false"/>
    </cc:interface>

    <cc:implementation>
        <h:panelGroup id="idChipArea" styleClass="mr-2">
            <h:panelGroup rendered="#{not cc.attrs.panel.editingIdentifier}" styleClass="chip-cell-wrapper">
                <p:chip label="#{cc.attrs.value}"
                        styleClass="#{cc.attrs.styleClass} entity-nav-chip"
                        icon="#{cc.attrs.icon}"
                        id="idChip"
                />
            </h:panelGroup>
            <h:panelGroup rendered="#{cc.attrs.panel.editingIdentifier}" styleClass="chip-cell-wrapper">
                <p:inputText id="editIdentifierInput"
                             value="#{cc.attrs.panel.editingIdentifierValue}"
                             styleClass="rum-edit-link-input"
                             style="min-width: 8em;"
                             onkeydown="if(event.key==='Enter'){event.preventDefault();$(this).closest('form').find('.rum-apply-header-edit-btn').trigger('click');}else if(event.key==='Escape'){event.preventDefault();$(this).closest('form').find('.rum-cancel-header-edit-btn').trigger('click');}"/>
            </h:panelGroup>
        </h:panelGroup>
    </cc:implementation>
</ui:composition>
