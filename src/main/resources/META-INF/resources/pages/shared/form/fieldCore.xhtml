<!-- /pages/shared/field/fieldCore.xhtml -->
<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://java.sun.com/jsf/html"

             xmlns:siaInplace="http://xmlns.jcp.org/jsf/composite/pages/shared/inplace"
             xmlns:c="http://java.sun.com/jsp/jstl/core">

    <!-- Expected @elvariable parameters -->
    <!--@elvariable id="bean" type="fr.siamois.ui.form.EntityFormContext"-->
    <!--@elvariable id="formCtx" type="fr.siamois.ui.form.EntityFormContext"-->
    <!--@elvariable id="col" type="fr.siamois.ui.table.column.TableColumn"-->
    <!--@elvariable id="prefix" type="java.lang.String"-->
    <!--@elvariable id="statusIndex" type="java.lang.Integer"-->
    <!--@elvariable id="rowIndex" type="java.lang.Integer"-->
    <!--@elvariable id="colIndex" type="java.lang.Integer"-->
    <!--@elvariable id="root" type="java.lang.String"-->
    <!--@elvariable id="panelIndex" type="java.lang.Integer"-->
    <!--@elvariable id="hasBeenModified" type="java.lang.Boolean"-->
    <!--@elvariable id="answer" type="fr.siamois.ui.viewmodel.fieldanswer.CustomFieldAnswerViewModel"-->
    <!--@elvariable id="onModified" type="javax.el.MethodExpression"-->
    <!--@elvariable id="panelHeaderUpdateId" type="java.lang.String"-->
    <!--@elvariable id="hasAutoGenerationFunction" type="java.lang.Boolean"-->
    <!--@elvariable id="onGenerateValue" type="javax.el.MethodExpression"-->
    <!--@elvariable id="panelStyleClass" type="java.lang.String"-->
    <!-- @elvariable id="conceptFieldsUpdateTargetsOnBlur" type="java.lang.String" -->
    <!-- @elvariable id="updateTargetsOnBlur" type="java.lang.String" -->
    <!-- @elvariable id="spatialUnitOptions" type="java.util.List" -->
    <!-- @elvariable id="mode" type="java.lang.String" -->
    <!-- @elvariable id="panelId" type="java.lang.String" -->

    <c:if test="#{(col['class'].simpleName eq 'FormFieldColumn') or col['class'].simpleName eq 'CustomColUiDto'}">

        <!--
            Every field/cell renders its own edit widget directly, gated only by 'mode' ('input' vs
            'output', decided panel/table-wide by the caller — see customFormFieldContentForTable.xhtml
            and customFormFieldContentForPanel.xhtml) — no per-cell/per-field "lightweight until
            clicked" activation or shared overlay.
        -->
        <ui:param name="fieldTypeName" value="#{col.field['class'].simpleName}"/>

        <!--
            Single dynamic include instead of a ~17-branch "fieldTypeName eq '...'" chain: each
            CustomField subtype's getEditFieldTemplatePath() (see CustomField.java) polymorphically
            resolves the one fragment to include, no repeated EL 'eq' scanning. All context this
            field's fragment could need is passed through explicitly since ui:include gives the
            included content its own variable scope.
        -->
        <ui:include src="#{col.field.editFieldTemplatePath}">
            <ui:param name="col" value="#{col}"/>
            <ui:param name="bean" value="#{bean}"/>
            <ui:param name="formCtx" value="#{formCtx}"/>
            <ui:param name="fieldTypeName" value="#{fieldTypeName}"/>
            <ui:param name="hasBeenModified" value="#{hasBeenModified}"/>
            <ui:param name="answer" value="#{answer}"/>
            <ui:param name="effectiveMode" value="#{mode}"/>
            <ui:param name="panelId" value="#{panelId}"/>
            <ui:param name="panelHeaderUpdateId" value="#{panelHeaderUpdateId}"/>
            <ui:param name="panelStyleClass" value="#{panelStyleClass}"/>
            <ui:param name="conceptFieldsUpdateTargetsOnBlur" value="#{conceptFieldsUpdateTargetsOnBlur}"/>
            <ui:param name="updateTargetsOnBlur" value="#{updateTargetsOnBlur}"/>
            <ui:param name="spatialUnitOptions" value="#{spatialUnitOptions}"/>
            <ui:param name="compact" value="#{compact}"/>
            <ui:param name="hasAutoGenerationFunction" value="#{hasAutoGenerationFunction}"/>
            <ui:param name="onGenerateValue" value="#{onGenerateValue}"/>
        </ui:include>

    </c:if>

</ui:fragment>
