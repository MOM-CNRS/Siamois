<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:jsf="http://xmlns.jcp.org/jsf"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:cc="http://xmlns.jcp.org/jsf/composite"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:form="http://java.sun.com/jsf/composite/pages/shared/form"
>
    <cc:interface>
        <cc:attribute name="title" type="java.lang.String" default=""/>
        <cc:attribute name="description" type="java.lang.String" default=""/>
        <cc:attribute name="profiles" required="true"/>
        <cc:attribute name="bean" required="true"/>
    </cc:interface>

    <cc:implementation>
        <form:csrfform formId="profilesListForm">
            <div class="datatable-settings">
                <div class="datatable-info">
                    <h2 class="dt-title" jsf:rendered="#{not empty cc.attrs.title}">#{cc.attrs.title}</h2>
                    <p class="dt-desc" jsf:rendered="#{not empty cc.attrs.description}">#{cc.attrs.description}</p>
                </div>
                <div class="dt-content">
                    <p:dataTable
                            id="profilesDatatable"
                            value="#{cc.attrs.profiles}"
                            var="profile"
                            rowKey="#{profile.id}"
                            selectionMode="single"
                            selection="#{cc.attrs.bean.selectedProfile}"
                            rowStyleClass="row-clickable"
                    >
                        <p:ajax event="rowSelect" update="@(.profile-detail-form)"/>
                        <p:ajax event="rowUnselect" update="@(.profile-detail-form)"/>
                        <f:facet name="emptyMessage">
                            <p class="members-empty-state">#{langBean.msg('profile.list.empty')}</p>
                        </f:facet>
                        <p:column headerText="#{langBean.msg('common.label.profile')}">
                            <span class="profile-name-cell">
                                <span class="profile-card-name">#{profile.name}</span>
                                <span class="profile-card-badge">#{langBean.msg('profile.card.systemBadge')}</span>
                                <span class="profile-card-permcount">#{langBean.msg('profile.card.permissionCount', profile.permissions.size())}</span>
                            </span>
                        </p:column>
                    </p:dataTable>
                </div>
            </div>
        </form:csrfform>
    </cc:implementation>

</ui:composition>
