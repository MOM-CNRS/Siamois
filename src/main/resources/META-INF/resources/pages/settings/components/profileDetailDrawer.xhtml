<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://java.sun.com/jsf/core">

    <h:form id="profileDetailForm" styleClass="profile-detail-form">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <h:panelGroup id="drawerContent" layout="block" styleClass="profile-drawer" rendered="#{bean.profileDetailOpen}">
                <div class="profile-resizer"></div>
                <div class="profile-drawer-header">
                    <div class="profile-drawer-title">#{empty bean.selectedProfile ? '' : bean.selectedProfile.name}</div>
                    <p:commandButton icon="pi pi-times" actionListener="#{bean.closeProfileDetail()}" update="@(.profile-detail-form)"
                                     styleClass="ui-button-flat ui-button-sm profile-drawer-close" process="@this"/>
                    <div class="profile-drawer-system-note">#{langBean.msg('profile.detail.systemNote')}</div>
                </div>

                <div class="profile-drawer-body">
                    <ui:fragment rendered="#{empty bean.permissionCatalogOf(bean.selectedProfile)}">
                        <div class="profile-readonly-value">#{langBean.msg('profile.detail.empty')}</div>
                    </ui:fragment>

                    <ui:repeat value="#{bean.permissionCatalogOf(bean.selectedProfile)}" var="theme">
                        <div class="profile-permission-theme">
                            <div class="profile-permission-theme-title">#{theme.label}</div>
                            <ui:repeat value="#{theme.rows}" var="row">
                                <div class="profile-permission-row">
                                    <p:selectBooleanCheckbox value="#{row.granted}" disabled="true"/>
                                    <span class="profile-permission-row-label">#{row.label}</span>
                                </div>
                            </ui:repeat>
                        </div>
                    </ui:repeat>
                </div>
            </h:panelGroup>
    </h:form>
    <script>
//<![CDATA[
        if (!window.siaProfileResizer) {
            window.siaProfileResizer = true;
            document.addEventListener('mousedown', function (e) {
                var handle = e.target.closest ? e.target.closest('.profile-resizer') : null;
                if (!handle) return;
                var split = handle.closest('.profiles-split');
                if (!split) return;
                e.preventDefault();
                handle.classList.add('dragging');
                var right = split.getBoundingClientRect().right;
                var move = function (ev) {
                    var w = Math.max(280, Math.min(right - ev.clientX, split.clientWidth - 280));
                    split.style.setProperty('--profile-panel-w', w + 'px');
                };
                var up = function () {
                    handle.classList.remove('dragging');
                    document.removeEventListener('mousemove', move);
                    document.removeEventListener('mouseup', up);
                };
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', up);
            });
        }
//]]>
    </script>
</ui:fragment>
