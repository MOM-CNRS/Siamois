<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<h:head>
    <title>Exécution d'export</title>
</h:head>

<h:body>
    <ui:composition template="/template.xhtml">
        <ui:define name="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-12">
                        <h1 class="page-header">Exécution d'export</h1>
                        
                        <div class="card">
                            <div class="card-header">
                                <h2>Lancer un export</h2>
                            </div>
                            <div class="card-body">
                                <h:form id="exportForm">
                                    <p:panelGrid columns="2" styleClass="p-fluid">
                                        <p:outputLabel for="template" value="Modèle de mapping *" />
                                        <p:selectOneMenu id="template" value="#{exportExecutionBean.selectedTemplate}" 
                                                         converter="exportTemplateConverter" 
                                                         required="true">
                                            <f:selectItems value="#{exportExecutionBean.templates}" 
                                                           var="template" 
                                                           itemLabel="#{template.name}" 
                                                           itemValue="#{template}" />
                                        </p:selectOneMenu>
                                        
                                        <p:commandButton value="Lancer l'export" 
                                                        action="#{exportExecutionBean.executeExport}" 
                                                        ajax="false"
                                                        icon="pi pi-play"
                                                        styleClass="btn btn-primary"/>
                                    </p:panelGrid>
                                </h:form>
                                
                                <h3>Résultats</h3>
                                <p:dataTable value="#{exportExecutionBean.exportResults}" 
                                             var="result" 
                                             paginator="true" 
                                             rows="10">
                                    <p:column headerText="Feuille">
                                        <h:outputText value="#{result.sheetName}" />
                                    </p:column>
                                    <p:column headerText="Lignes">
                                        <h:outputText value="#{result.rowCount}" />
                                    </p:column>
                                    <p:column headerText="Statut">
                                        <h:outputText value="#{result.status}" />
                                    </p:column>
                                </p:dataTable>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ui:define>
    </ui:composition>
</h:body>
</html>
