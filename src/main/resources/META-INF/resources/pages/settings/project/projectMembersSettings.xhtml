<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:settings="http://java.sun.com/jsf/composite/pages/settings/components"
                xmlns:p="http://primefaces.org/ui"
                xmlns:form="http://java.sun.com/jsf/composite/pages/shared/form" xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="metadata">
        <f:event type="preRenderView" listener="#{navBean.onPreRenderView}"/>
        <f:event type="preRenderView" listener="#{projectDetailsBean.checkProjectOrRedirect}"/>
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="settings.css"/>
    </ui:define>

    <ui:define name="content">
        <main>
            <div class="settings-header">
            <form:csrfform formId="breadCrumbForm" styleClass="breadCrumpForm">
                <p:breadCrumb homeDisplay="false">
                    <p:menuitem value="Projets" action="#{projectDetailsBean.goToProjectList()}"/>
                    <p:menuitem value="#{projectDetailsBean.project.name}" action="#{projectDetailsBean.backToProjectSettings()}"/>
                    <p:menuitem value="#{langBean.msg('projectSettings.titles.members')}"/>
                </p:breadCrumb>
            </form:csrfform>
            </div>
            <div class="settings-page-header">
                <h2 class="dt-title">#{langBean.msg('projectSettings.membersProfiles.title')}</h2>
            </div>
            <p:tabView id="projectMembersTabs" dynamic="false" styleClass="settings-tabs">
            <p:tab title="#{langBean.msg('common.label.members.tab')}">
            <settings:datatable
                    id="projectMembersDatatable"
                    filterAction="#{projectMembersListBean.filter()}"
                    formId="projectMembersForm"
                    addAction="#{projectMembersListBean.add()}"
                    searchInputTextValue="#{projectMembersListBean.searchInput}"
                    renderCreateButton="true"
                    createButtonLabel="#{langBean.msg('projectSettings.members.dialog.label')}"
            >
                <p:dataTable
                        id="membersDatatable"
                        value="#{projectMembersListBean.members}"
                        var="member"
                        sortMode="single"
                        widgetVar="projectMembersDatatableWidget"
                        rowKey="#{member.id}"
                >
                    <p:autoUpdate/>
                    <f:facet name="emptyMessage">
                        <p class="members-empty-state">
                            <p:commandLink value="#{langBean.msg('projectSettings.members.empty')}"
                                           action="#{projectMembersListBean.add()}"
                                           immediate="true"/>
                        </p>
                    </f:facet>
                    <p:column headerText="#{langBean.msg('common.label.user')}">
                        <div class="member-user-cell">
                            <span class="member-avatar">#{member.person.initials()}</span>
                            <strong>#{member.displayName()}</strong>
                            <span class="member-email">#{member.person.email}</span>
                        </div>
                    </p:column>
                    <p:column headerText="#{langBean.msg('common.label.profile')}">
                        <p:selectCheckboxMenu value="#{member.profiles}"
                                               id="profileSelect"
                                               converter="#{profileDTOConverter}"
                                               panelStyleClass="profile-select-panel"
                                               label="#{langBean.msg('common.label.profile')}"
                                               updateLabel="true"
                                               multiple="true"
                                               filter="true"
                                               filterMatchMode="contains"
                                               scrollHeight="200">
                            <f:selectItems value="#{projectMembersListBean.availableProfiles}" var="p" itemLabel="#{p.name}" itemValue="#{p}"/>
                            <f:attribute name="member" value="#{member}"/>
                            <p:ajax event="itemSelect" listener="#{projectMembersListBean.onProfileSelect}" process="@this"/>
                            <p:ajax event="itemUnselect" listener="#{projectMembersListBean.onProfileUnselect}" process="@this" update="profileSelect"/>
                        </p:selectCheckboxMenu>
                    </p:column>
                    <p:column headerText="#{langBean.msg('common.label.accountStatus')}">
                        <span class="chip #{projectMembersListBean.accountStatusChipClass(member.person)}">
                            #{projectMembersListBean.accountStatusLabel(member.person)}
                        </span>
                        <p:commandButton value="#{langBean.msg('common.action.resendInvitation')}"
                                         icon="pi pi-refresh"
                                         rendered="#{projectMembersListBean.isInvitationExpired(member.person)}"
                                         actionListener="#{projectMembersListBean.resendInvitation(member)}"
                                         update="membersDatatable"
                                         styleClass="ui-button-flat ui-button-sm resend-invitation-button"/>
                    </p:column>
                    <p:column>
                        <p:commandButton value="#{langBean.msg('common.action.remove')}"
                                         actionListener="#{projectMembersListBean.removeMember(member)}"
                                         update="membersDatatable"
                                         styleClass="ui-button-danger"/>
                    </p:column>
                </p:dataTable>
            </settings:datatable>
            </p:tab>
            <p:tab title="#{langBean.msg('profile.tab.label')}">
                <div class="profiles-split">
                <settings:profilesList
                        profiles="#{projectMembersListBean.availableProfiles}"
                        bean="#{projectMembersListBean}"/>
                <ui:include src="/pages/settings/components/profileDetailDrawer.xhtml">
                    <ui:param name="bean" value="#{projectMembersListBean}"/>
                </ui:include>
                </div>
            </p:tab>
            </p:tabView>
            <ui:include src="/dialog/shared/newMemberDialog.xhtml">
                <ui:param name="dialogBean" value="#{newProjectMemberDialogBean}"/>
                <ui:param name="updateTarget" value=":projectMembersTabs:projectMembersDatatable:formCC:projectMembersForm:membersDatatable"/>
            </ui:include>
        </main>
    </ui:define>

</ui:composition>
