<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://java.sun.com/jsf/core">

    <h:form id="fieldEditForm">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <h:panelGroup rendered="#{projectTableFieldSettingsBean.drawerOpen}">
            <!-- A native button, not a div: the scrim is clickable, so it must be focusable and
                 keyboard-activatable — which <button> is for free, without role nor key handlers. -->
            <button type="button" class="ptc-drawer-scrim"
                    aria-label="#{langBean.msg('projectTables.drawer.close')}"
                    onclick="document.getElementById('fieldEditForm:cancelBtn').click()"></button>
            <div class="ptc-drawer">
                <div class="ptc-drawer-header">
                    <div class="ptc-drawer-title">
                        #{projectTableFieldSettingsBean.draftCreateMode ? langBean.msg('projectTables.drawer.titleCreate') : langBean.msg('projectTables.drawer.titleEdit')}
                    </div>
                </div>

                <div class="ptc-drawer-body">
                    <div class="ptc-drawer-field">
                        <label class="ptc-drawer-label" for="fieldEditForm:draftName">#{langBean.msg('projectTables.drawer.name')}</label>
                        <p:inputText id="draftName" value="#{projectTableFieldSettingsBean.draftName}" style="width:100%"/>
                    </div>

                    <div class="ptc-drawer-field">
                        <label class="ptc-drawer-label" for="fieldEditForm:draftType">#{langBean.msg('projectTables.drawer.type')}</label>
                        <h:selectOneMenu id="draftType" value="#{projectTableFieldSettingsBean.draftTypeName}" styleClass="ptc-native-select">
                            <f:selectItems value="#{projectTableFieldSettingsBean.fieldTypeOptions}" var="t" itemLabel="#{t.label}" itemValue="#{t.name()}"/>
                        </h:selectOneMenu>
                    </div>

                    <div class="ptc-drawer-field">
                        <label class="ptc-drawer-label" for="fieldEditForm:draftDescription">#{langBean.msg('projectTables.drawer.description')} #{langBean.msg('projectTables.drawer.descriptionOptional')}</label>
                        <p:inputTextarea id="draftDescription" value="#{projectTableFieldSettingsBean.draftDescription}"
                                         placeholder="#{langBean.msg('projectTables.drawer.descriptionPlaceholder')}"
                                         style="width:100%" rows="3" autoResize="false"/>
                        <div class="ptc-field-hint">#{langBean.msg('projectTables.drawer.descriptionHint')}</div>
                    </div>
                </div>

                <div class="ptc-drawer-footer">
                    <p:commandButton id="cancelBtn" value="#{langBean.msg('common.action.cancel')}" styleClass="ui-button-secondary"
                                      actionListener="#{projectTableFieldSettingsBean.closeDrawer()}" immediate="true" update="@form :projectTablesFormCC:projectTablesForm"/>
                    <p:commandButton value="#{langBean.msg('common.action.save')}"
                                      actionListener="#{projectTableFieldSettingsBean.saveDrawer()}" update="@form :projectTablesFormCC:projectTablesForm"/>
                </div>
            </div>
        </h:panelGroup>
    </h:form>
</ui:fragment>
