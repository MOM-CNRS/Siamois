<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://java.sun.com/jsf/core">

    <h:form id="rulesForm">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <p:sidebar widgetVar="rulesSidebar" visible="#{fieldRulesEditorBean.open}"
                   position="right" modal="true" dismissable="true" closeOnEscape="true" blockScroll="true"
                   styleClass="ptc-drawer-sidebar" style="width:500px;max-width:94vw;">
            <p:ajax event="close" listener="#{fieldRulesEditorBean.close()}" update=":rulesForm:rulesContent"/>

            <h:panelGroup id="rulesContent" layout="block" styleClass="ptc-drawer">
                <h:panelGroup rendered="#{fieldRulesEditorBean.open}">
                    <div class="ptc-drawer-header">
                        <div class="ptc-drawer-title">#{langBean.msg('rules.title')}</div>
                        <div class="ptc-drawer-system-note">#{fieldRulesEditorBean.labelOf(fieldRulesEditorBean.field)}</div>
                    </div>

                    <h:panelGroup layout="block" styleClass="ptc-drawer-messages"
                                  rendered="#{not empty fieldRulesEditorBean.errorMessage}">
                        <div class="ptc-drawer-error">
                            <i class="bi bi-exclamation-triangle-fill"/>
                            <span>#{fieldRulesEditorBean.errorMessage}</span>
                        </div>
                    </h:panelGroup>

                    <div class="ptc-drawer-body">
                        <ui:include src="/pages/settings/project/ruleCondition.xhtml">
                            <ui:param name="draft" value="#{fieldRulesEditorBean.enabledWhen}"/>
                            <ui:param name="title" value="#{langBean.msg('rules.enabledWhen')}"/>
                        </ui:include>

                        <ui:include src="/pages/settings/project/ruleCondition.xhtml">
                            <ui:param name="draft" value="#{fieldRulesEditorBean.requiredWhen}"/>
                            <ui:param name="title" value="#{langBean.msg('rules.requiredWhen')}"/>
                        </ui:include>

                        <h:panelGroup rendered="#{fieldRulesEditorBean.ownConcept}" layout="block" styleClass="ptc-drawer-field ptc-rule-block">
                            <span class="ptc-drawer-label">#{langBean.msg('rules.options')}</span>
                            <h:panelGroup rendered="#{fieldRulesEditorBean.advancedOptions ne null}">
                                <div class="ptc-hint">#{langBean.msg('rules.advancedKept')}</div>
                                <p:commandButton value="#{langBean.msg('rules.removeAdvanced')}" styleClass="ui-button-outlined ui-button-sm"
                                                 actionListener="#{fieldRulesEditorBean.clearAdvancedOptions()}" process="@this"
                                                 update=":rulesForm:rulesContent"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{fieldRulesEditorBean.advancedOptions eq null}">
                                <p:selectOneMenu value="#{fieldRulesEditorBean.optionsFieldId}" style="width:100%;" filter="true">
                                    <f:selectItem itemLabel="#{langBean.msg('rules.optionsNone')}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{fieldRulesEditorBean.conceptFields}" var="cf"
                                                   itemLabel="#{fieldRulesEditorBean.labelOf(cf)}" itemValue="#{cf.id}"/>
                                </p:selectOneMenu>
                                <div class="ptc-field-hint">#{langBean.msg('rules.optionsHint')}</div>
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{fieldRulesEditorBean.ownOrdered}" layout="block" styleClass="ptc-drawer-field ptc-rule-block">
                            <span class="ptc-drawer-label">#{langBean.msg('rules.constraints')}</span>
                            <ui:repeat value="#{fieldRulesEditorBean.constraints}" var="cn">
                                <div class="ptc-rule-leaf-row">
                                    <p:selectOneMenu value="#{cn.op}" style="width:150px;">
                                        <f:selectItems value="#{fieldRulesEditorBean.constraintOps}" var="co"
                                                       itemLabel="#{fieldRulesEditorBean.constraintOpLabel(co)}" itemValue="#{co}"/>
                                    </p:selectOneMenu>
                                    <p:selectOneMenu value="#{cn.fieldId}" style="flex:1;" filter="true">
                                        <f:selectItem itemLabel="#{langBean.msg('rules.chooseField')}" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{fieldRulesEditorBean.comparableFields}" var="cmp"
                                                       itemLabel="#{fieldRulesEditorBean.labelOf(cmp)}" itemValue="#{cmp.id}"/>
                                    </p:selectOneMenu>
                                    <p:commandButton icon="bi bi-x-lg" styleClass="ui-button-flat ui-button-sm"
                                                     actionListener="#{fieldRulesEditorBean.removeConstraint(cn)}" process="@this"
                                                     update=":rulesForm:rulesContent"/>
                                </div>
                            </ui:repeat>
                            <p:commandButton value="#{langBean.msg('rules.addConstraint')}" styleClass="ui-button-outlined ui-button-sm"
                                             actionListener="#{fieldRulesEditorBean.addConstraint()}" process="@form"
                                             update=":rulesForm:rulesContent"/>
                        </h:panelGroup>
                    </div>

                    <div class="ptc-drawer-footer">
                        <p:commandButton value="#{langBean.msg('common.action.cancel')}" styleClass="ui-button-secondary"
                                         actionListener="#{fieldRulesEditorBean.close()}" immediate="true"
                                         update=":rulesForm:rulesContent"/>
                        <p:commandButton value="#{langBean.msg('common.action.save')}"
                                         actionListener="#{fieldRulesEditorBean.save()}" process="@form"
                                         update=":rulesForm:rulesContent :projectTablesFormCC:projectTablesForm:fieldsTabs:layoutTable"/>
                    </div>
                </h:panelGroup>
            </h:panelGroup>
        </p:sidebar>
    </h:form>
</ui:fragment>
