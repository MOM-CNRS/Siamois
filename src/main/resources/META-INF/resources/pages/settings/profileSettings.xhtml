<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="metadata">
    <f:event type="preRenderView" listener="#{navBean.onPreRenderView}"/>
    <f:event type="preRenderView" listener="#{profileSettingsBean.init()}"/>
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="settings.css"/>
    </ui:define>


    <ui:define name="content">
        <main class="container-lg">
            <h:form id="profileForm" styleClass="sia-settings-form">
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                <div class="field-value-group">
                    <h2 class="field-value-title">#{langBean.msg('nav.myProfile')}</h2>
                    <div class="field-value-content">
                        <div class="form-group row">
                            <label for="profile-email" class="col-sm-2 col-form-label" style="width: 40%">#{langBean.msg('common.label.email')}</label>
                            <div class="col-md-7 field-value-value">
                                <p:inputText disabled="true" id="profile-email" type="email" value="#{profileSettingsBean.FEmail}"/>
                            </div>
                        </div>
                        <hr/>
                        <div class="form-group row">
                            <label for="profile-email" class="col-sm-2 col-form-label" style="width: 40%">#{langBean.msg('common.label.lastname')}</label>
                            <div class="col-md-7 field-value-value">
                                <p:inputText id="profile-lastname" value="#{profileSettingsBean.FLastname}"/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="profile-firstname" class="col-sm-2 col-form-label"
                                   style="width: 40%">#{langBean.msg("common.label.firstname")}</label>
                            <div class="col-md-7 field-value-value">
                                <p:inputText id="profile-firstname" value="#{profileSettingsBean.FFirstname}"/>
                            </div>
                        </div>
                    </div>
                    <p:commandButton
                            styleClass="field-value-save"
                            value="#{langBean.msg('common.action.save')}"
                            action="#{profileSettingsBean.saveProfile()}"
                    />
                </div>
            </h:form>
            <h:form id="preferenceSettingsForm" styleClass="sia-settings-form">
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                <div class="field-value-group">
                    <h2 class="field-value-title">#{langBean.msg('myProfile.preferences')}</h2>
                    <div class="field-value-content">
                        <div class="form-group row">
                            <label for="institutionSelectionMenu" class="col-sm-2 col-form-label" style="width: 40%">#{langBean.msg('myProfile.preferences.institution')}</label>
                            <div class="col-md-7 field-value-value">
                                <p:selectOneMenu id="institutionSelectionMenu"
                                                 value="#{profileSettingsBean.FDefaultInstitutionId}"
                                                 var="inst"
                                                 style="width: 100%"
                                                 filter="true"
                                                 filterMatchMode="contains"
                                                 filterNormalize="true"
                                >
                                    <f:selectItems
                                            value="#{profileSettingsBean.refInstitutions}"
                                            var="item"
                                            itemValue="#{item.id}"
                                            itemLabel="#{item.name}"
                                    />

                                    <p:column>
                                        <h:outputText value="#{profileSettingsBean.labelOfInstitutionWithId(inst)}"/>
                                    </p:column>

                                </p:selectOneMenu>
                            </div>
                        </div>
                        <hr/>
                        <div class="form-group row">
                            <label for="langSetting" class="col-sm-2 col-form-label" style="width: 40%">#{langBean.msg('myProfile.preferences.lang')}</label>
                            <div class="col-md-7 field-value-value">
                                <p:selectOneMenu id="langSetting"
                                                 var="lang"
                                                 value="#{profileSettingsBean.FSelectedLang}"
                                                 label="#{profileSettingsBean.codeToLangName(lang)}"
                                                 style="width: 100%"
                                >
                                    <f:selectItems
                                            value="#{profileSettingsBean.refLangs}"
                                            var="langItem"
                                            itemValue="#{profileSettingsBean.localeToLangCode(langItem)}"
                                            itemLabel="#{profileSettingsBean.localeToLangName(langItem)}"
                                    />

                                    <p:column>
                                        <h:outputText value="#{profileSettingsBean.codeToLangName(lang)}"/>
                                    </p:column>

                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>
                    <p:commandButton
                            styleClass="field-value-save"
                            value="#{langBean.msg('common.action.save')}"
                            actionListener="#{profileSettingsBean.savePreferences()}"/>

                </div>
            </h:form>
            <h:form id="rightsForm" styleClass="sia-settings-form">
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                <div class="field-value-group">
                    <h2 class="field-value-title">#{langBean.msg('myProfile.rights')}</h2>
                    <div class="field-value-content">
                        <p class="rights-description">#{langBean.msg('myProfile.rights.description')}</p>
                        <p:dataTable id="rightsTable"
                                     value="#{profileSettingsBean.rights}"
                                     var="grant"
                                     emptyMessage="#{langBean.msg('myProfile.rights.empty')}">
                            <p:column headerText="#{langBean.msg('myProfile.rights.target')}">
                                <i class="bi #{grant.project ? 'bi-arrow-down-square' : (grant.organisation ? 'bi-buildings' : 'bi-globe')} row-rights-icon"/>
                                <h:outputText value=" #{grant.instance ? langBean.msg('myProfile.rights.instance') : grant.targetName}"/>
                            </p:column>
                            <p:column headerText="#{langBean.msg('common.label.profile')}">
                                <h:outputText value="#{grant.profileName}"/>
                            </p:column>
                            <p:column headerText="#{langBean.msg('myProfile.rights.permissions')}" styleClass="rights-permissions-cell">
                                <div class="rights-permissions">
                                    <ui:repeat var="code" value="#{grant.permissionCodes}">
                                        <span class="chip chip-profile">#{profileSettingsBean.permissionLabel(code)}</span>
                                    </ui:repeat>
                                </div>
                            </p:column>
                            <p:column styleClass="rights-open-cell">
                                <p:commandButton icon="bi bi-box-arrow-up-right"
                                                 actionListener="#{profileSettingsBean.open(grant)}"
                                                 rendered="#{profileSettingsBean.canOpen(grant)}"
                                                 styleClass="ui-button-flat"
                                                 title="#{langBean.msg('myProfile.rights.open')}"
                                                 process="@this"/>
                            </p:column>
                        </p:dataTable>
                    </div>
                </div>
            </h:form>
        </main>
    </ui:define>

</ui:composition>
