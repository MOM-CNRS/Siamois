<!DOCTYPE HTML>
<HTML xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:form="http://java.sun.com/jsf/composite/pages/shared/form"
      xml:lang="#{langBean.languageCode}"
>

<h:head>
    <link rel="icon" type="image/png" href="#{request.contextPath}/resources/img/favicon.png"/>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
    <title>#{langBean.msg('forgotPassword.title')}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0"/>
    <h:outputStylesheet library="css" name="login.css"/>
</h:head>

<h:body>
    <section class="h-100 gradient-form">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-xl-6">
                    <div class="card rounded-3">
                        <div class="login-logo text-center pt-4">
                            <a href="https://siamois.eu" target="_blank" rel="noopener noreferrer">
                                <h:graphicImage library="img" name="logos/siamois-couleur-baseline.png" alt="Siamois"/>
                            </a>
                        </div>
                        <div class="px-3 py-4 p-md-5 mx-md-4">
                            <h1>#{langBean.msg('forgotPassword.title')}</h1>

                            <h:panelGroup rendered="#{not forgotPasswordBean.sent}">
                                <p class="description">#{langBean.msg('forgotPassword.description')}</p>
                                <hr/>
                                <form:csrfform formId="forgotPasswordForm">
                                    <div class="form-group mb-4">
                                        <p:outputLabel for="email" value="#{langBean.msg('common.label.email')}"/>
                                        <h:inputText id="email" styleClass="form-control" type="email"
                                                     value="#{forgotPasswordBean.email}" required="true"
                                                     requiredMessage="#{langBean.msg('register.error.email')}"/>
                                        <h:message for="email" styleClass="text-danger d-block mt-1"/>
                                    </div>
                                    <h:commandButton styleClass="btn btn-success"
                                                     value="#{langBean.msg('forgotPassword.action.submit')}"
                                                     action="#{forgotPasswordBean.submit}"/>
                                </form:csrfform>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{forgotPasswordBean.sent}">
                                <p class="description">#{langBean.msg('forgotPassword.sent')}</p>
                                <hr/>
                            </h:panelGroup>

                            <div class="mt-3">
                                <a href="#{request.contextPath}/login">#{langBean.msg('forgotPassword.backToLogin')}</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</h:body>

</HTML>
