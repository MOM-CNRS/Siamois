<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
>

    <ui:define name="head">

        <title>#{focusViewBean.mainPanel.resolveTitleOrTitleCode()}</title>

        <link rel="icon"
              type="image/svg+xml"
              href="#{request.contextPath}#{focusViewBean.mainPanel.svgIcon()}"/>


    </ui:define>

    <ui:define name="metadata">
        <f:event type="preRenderView" listener="#{presentationBean.continueIfLogged()}"/>
        <f:metadata>
            <f:viewParam name="main" value="#{focusViewBean.mainToken}"/>
            <f:viewParam name="s" value="#{focusViewBean.secondaryToken}"/>
            <f:viewParam name="back" value="#{focusViewBean.backToken}"/>
            <f:viewAction action="#{focusViewBean.beforeInit}" onPostback="false"/>
        </f:metadata>
    </ui:define>

    <ui:define name="content">

        <ui:include src="/pages/shared/topbar.xhtml"/>

        <p:outputPanel style="display: flex;flex:1; flex-direction: row; overflow-y: hidden;" id="flow"
                       styleClass="focus">

            <h:form
                    id="subSidebarForm"
                    styleClass="sub-sidebar-container #{sidebarBean.visible ? '' : 'is-collapsed'} mode-#{sidebarBean.currentMode.name().toLowerCase()}"
                    style="height: 100%; flex-direction: column; align-items: center;"
            >
                <style>
                    .ui-datatable-invisible-header thead {
                        display: none !important;
                    }

                    .ui-datatable-invisible-header .ui-datatable-data tr td {
                        border: none !important;
                        padding: 4px 8px !important;
                    }

                    .bookmark-row {
                        display: flex;
                        align-items: center;
                        width: 100%;
                    }
                </style>

                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

                <p:outputLabel id="sidebarAnimatedInner" class="sidebar-animated-inner"
                               style="width: 320px; height: 100%; display: flex; flex-direction: column;">

                    <div id="historyDiv" style="background: white; width: 100%; border: 1px solid #dee2e6;">
                        <p:commandButton
                                id="toggle-sidebar-btn"
                                value="#{sidebarBean.currentMode == 'HISTORIQUE' ? 'Historique' : 'Favoris'}"
                                style="width: 100%"
                                icon="bi bi-chevron-double-left"
                                action="#{sidebarBean.close()}"
                                onstart="animateSidebarClose();"
                                update="sidebarContent"
                                process="@this"
                                styleClass="ui-button-flat"
                        />
                    </div>

                    <p:outputPanel id="sidebarContent" style="height: 100%; width: 100%; flex-grow: 1;">

                        <p:outputPanel id="historyPanel" rendered="#{sidebarBean.currentMode == 'HISTORIQUE'}">
                            <div style="height: 100%">
                                <p:dataTable id="historyTable"
                                             value="#{historyBean.items}"
                                             var="historyItem"
                                             rowKey="#{historyItem.id}"
                                             scrollable="true"
                                             scrollRows="40"
                                             scrollHeight="100%"
                                             virtualScroll="true"
                                             styleClass="ui-datatable-invisible-header panel-menu">



                                    <p:column style="vertical-align: middle; width:100%">
                                        <div class="bookmark-row" style="width: 100%;">

                                                    <p:commandButton id="historyLink"
                                                                     action="#{historyBean.redirectToEntry(historyItem)}"
                                                                     icon="#{historyItem.icon}"
                                                                     process="@this"
                                                                     value="#{historyItem.title}"
                                                                     styleClass="#{historyItem.styleClass} nav-link ui-button-flat bookmark-full-button"
                                                                     style="width:100%">
                                                    </p:commandButton>
                                                    <p:tooltip for="historyLink"
                                                               value="#{historyItem.title}"/>

                                        </div>
                                    </p:column>
                                </p:dataTable>
                            </div>
                        </p:outputPanel>

                        <p:outputPanel id="bookmarkPanel" style="height: 100%" rendered="#{sidebarBean.currentMode == 'BOOKMARKS'}">
                                <p:dataTable id="bookmarksTable"
                                             value="#{bookmarkMenuBean.lazyModel}"
                                             var="bkm"
                                             lazy="true"
                                             editable="true"
                                             rowKey="#{bkm.id}"
                                             scrollable="true"
                                             scrollRows="40"
                                             scrollHeight="100%"
                                             virtualScroll="true"
                                             styleClass="ui-datatable-invisible-header panel-menu">

                                    <p:ajax event="rowEdit" listener="#{bookmarkMenuBean.onRowEdit}"
                                            update="bookmarksTable"/>
                                    <p:ajax event="rowEditCancel" listener="#{bookmarkMenuBean.onRowCancel}"/>


                                    <p:column style="vertical-align: middle; width:100%">
                                        <div class="bookmark-row" style="width: 100%;">
                                            <p:cellEditor style="width: 100%" >
                                                <f:facet name="output">
                                                    <p:commandButton id="bookmarkLink"
                                                                     action="#{bookmarkMenuBean.redirectToEntry(bkm)}"
                                                                     icon="#{bkm.bookmarkIcon}"
                                                                     process="@this"
                                                                     value="#{bookmarkMenuBean.resolveName(bkm)}"
                                                                     styleClass="nav-link ui-button-flat bookmark-full-button"
                                                                     style="color: #{bkm.bookmarkColor} !important; width:100%">
                                                    </p:commandButton>
                                                    <p:tooltip for="bookmarkLink"
                                                               value="#{bookmarkMenuBean.getFilterTooltipSummary(bkm)}"/>
                                                </f:facet>

                                                <f:facet name="input">
                                                    <div style="display: flex; align-items: center; width: 100%; padding: 4px 12px;">
                                                        <i class="#{bkm.bookmarkIcon}"
                                                           style="margin-right: 8px; color: #{bkm.bookmarkColor};"/>
                                                        <p:inputText value="#{bkm.title}" style="width: 100%;"
                                                                     required="true"/>
                                                    </div>
                                                </f:facet>
                                            </p:cellEditor>
                                        </div>
                                    </p:column>

                                    <p:column style="width: 40px; text-align: center; vertical-align: middle;">
                                        <p:rowEditor rendered="#{bookmarkMenuBean.canEditViewNameOfBookmark(bkm)}"
                                                     editTitle="Modifier" saveTitle="Valider" cancelTitle="Annuler" />
                                    </p:column>

                                    <p:column style="width: 40px; text-align: center; vertical-align: middle;">
                                        <p:commandButton action="#{bookmarkMenuBean.deleteItem(bkm)}"
                                                         icon="bi bi-trash"

                                                         update="bookmarksTable"
                                                         process="@this"
                                                         styleClass="ui-button-flat ui-button-danger rounded-button"/>
                                    </p:column>
                                </p:dataTable>
                        </p:outputPanel>

                    </p:outputPanel>
                </p:outputLabel>
            </h:form>

            <p:outputPanel id="flowContent" styleClass="flow fullscreen-flow focus">
                <h:panelGroup
                        style="display:flex;flex-direction: column;gap:0em;padding:0em;border-radius:0px; border:0px;"
                        styleClass="focus"
                        id="flow-panels">

                    <p:outputPanel id="panel-${focusViewBean.mainPanel.prefixPanelIndex}-container" styleClass="focus"
                                   style="display:flex;flex-direction:row;overflow:hidden;height:100%;width:100%;">

                    <h:panelGroup
                            styleClass="#{focusViewBean.mainPanel.panelClass} panel-docked focus"
                            style="border-radius: 0px; display: flex; flex-direction: column; border-top: 3px solid var(--main-color); flex: 1 1 auto; min-width: 0;"
                            id="panel-${focusViewBean.mainPanel.prefixPanelIndex}">

                        <!--
                            JSF chrome + panelContent.xhtml include, unchanged, for every panel type
                            EXCEPT a React-enabled one (RecordingUnitPanel) — see the React branch below,
                            which replaces this entire block (titlebar toolbar included) with one React
                            app, and moves the overview slot out to a page-level sibling (see below).

                            c:if (build-time), not rendered (runtime): panelContent.xhtml includes
                            overviewContent.xhtml, which declares a fixed "sideview-${panelIndex}" id —
                            with a plain `rendered` attribute JSF would still build (and register the id
                            of) this whole branch even while hidden, colliding with the React branch's own
                            direct include of overviewContent.xhtml below (JSF1073 duplicate id). c:if
                            excludes the branch from the tree entirely instead.
                        -->
                        <c:if test="#{not focusViewBean.mainPanel.reactPanelEnabled}">

                            <div class="sideview-titlebar" style="background: var(--siamois-green-light-100);">
                                <h:form style="float:right;display: flex;
    gap: 1rem;" id="actionForm-${focusViewBean.mainPanel.panelIndex}">
                                    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                                    <p:splitButton id="dirtyViewSplitButton"
                                                   styleClass="view-edit-button"
                                                   rendered="#{focusViewBean.mainPanel.canUserUpdateView()
                                                   and focusViewBean.mainPanel.isDirty()}"
                                                   value="Mettre à jour"
                                                   icon="bi bi-bookmark"
                                                   action="#{focusViewBean.mainPanel.updateCurrentView()}"
                                                   update="panel-${focusViewBean.mainPanel.prefixPanelIndex}">
                                        <p:menuitem value="Enregistrer comme nouvelle vue"
                                                    update="panel-${focusViewBean.mainPanel.prefixPanelIndex}, subSidebarForm"
                                                    action="#{focusViewBean.mainPanel.saveAsNewView()}"
                                                    icon="bi bi-bookmark"/>
                                        <p:menuitem value="Réinitialiser la vue"
                                                    update="panel-${focusViewBean.mainPanel.prefixPanelIndex}"
                                                    action="#{focusViewBean.mainPanel.reinitializeView()}"
                                                    icon="bi bi-arrow-clockwise"/>
                                    </p:splitButton>
                                    <p:splitButton value="Enregistrer comme nouvelle vue"
                                                   styleClass="view-edit-button"
                                                   update="panel-${focusViewBean.mainPanel.prefixPanelIndex}, subSidebarForm"
                                                   rendered="#{(not focusViewBean.mainPanel.canUserUpdateView()) and focusViewBean.mainPanel.isDirty()}"
                                                   action="#{focusViewBean.mainPanel.saveAsNewView()}"
                                                   icon="bi bi-bookmark">
                                        <p:menuitem value="Réinitialiser la vue"
                                                    update="panel-${focusViewBean.mainPanel.prefixPanelIndex}"
                                                    action="#{focusViewBean.mainPanel.reinitializeView()}"
                                                    icon="bi bi-arrow-clockwise"/>
                                    </p:splitButton>
                                    <div style="padding: 3px;
                                            display: flex;
                                            border: 1px solid var(--siamois-green-light);
                                            border-radius: 15px;">

                                        <p:commandLink id="closeFocusLink"
                                                       rendered="#{not empty focusViewBean.mainPanel.goBackUrl}"
                                                       styleClass="sideview-topbar-button"
                                                       onclick="window.location.href='#{focusViewBean.mainPanel.goBackUrl}'; return false;"
                                                       title="#{langBean.msg('nav.closeFocus')}">
                                            <h:outputText styleClass="bi bi-arrows-angle-contract"/>
                                        </p:commandLink>
                                        <p:commandLink id="bookmarkToggleButton"
                                                       styleClass="sideview-topbar-button"
                                                       action="#{focusViewBean.mainPanel.togglePanelBookmark()}"
                                                       update="bookmarkToggleButton, navBarCsrfForm:siamoisNavForm, subSidebarForm, actionForm-#{focusViewBean.mainPanel.panelIndex}">
                                            <h:outputText styleClass="#{focusViewBean.mainPanel.isBookmarked() ?
                            'ui-icon bi bi-bookmark-fill' : 'ui-icon bi bi-bookmark'}"/>
                                        </p:commandLink>
                                        <p:commandLink id="createEntityBtn"
                                                       rendered="#{focusViewBean.mainPanel.creationUnitKind != null and flowBean.isWriteMode}"
                                                       styleClass="sideview-topbar-button"
                                                       action="#{genericNewUnitDialogBean.openNewEntityDiag(focusViewBean.mainPanel.creationUnitKind, focusViewBean.mainPanel)}"
                                                       update="newUnitForm"
                                                       oncomplete="PF('newUnitDiag').show();"
                                                       immediate="true">
                                            <h:outputText styleClass="bi bi-plus-square"/>
                                        </p:commandLink>
                                        <p:tooltip for="createEntityBtn" value="Créer" position="bottom"/>
                                        <p:commandLink id="duplicateBtn"
                                                       rendered="#{focusViewBean.mainPanel.canDuplicate() and flowBean.isWriteMode}"
                                                       styleClass="sideview-topbar-button"
                                                       action="#{focusViewBean.mainPanel.duplicate()}"
                                                       update="panel-${focusViewBean.mainPanel.prefixPanelIndex}-container"
                                                       immediate="true">
                                            <h:outputText styleClass="bi bi-copy"/>
                                        </p:commandLink>
                                        <p:tooltip for="duplicateBtn" value="Dupliquer" position="bottom"/>
                                        <h:commandLink id="duplicateBtnDisabled"
                                                      rendered="#{focusViewBean.mainPanel.creationUnitKind != null
                                                                  and not focusViewBean.mainPanel.canDuplicate()
                                                                  and flowBean.isWriteMode}"
                                                      styleClass="sideview-topbar-button ui-commandlink ui-widget"
                                                      style="opacity:0.4; cursor:not-allowed;">
                                            <i class="bi bi-copy"/>
                                        </h:commandLink>
                                        <p:tooltip for="duplicateBtnDisabled" value="À venir" position="bottom" autoHide="false"/>
                                        <p:commandLink id="refreshPanelButton"
                                                       styleClass="sideview-topbar-button"
                                                       action="#{focusViewBean.mainPanel.refresh()}"
                                                       onstart="PF('buiPanel_${focusViewBean.mainPanel.panelIndex}').show();"
                                                       oncomplete="PF('buiPanel_${focusViewBean.mainPanel.panelIndex}').hide();"
                                                       onclick="event.stopPropagation();"
                                                       update="panel-${focusViewBean.mainPanel.prefixPanelIndex}">
                                            <h:outputText styleClass="bi bi-arrow-clockwise"/>
                                        </p:commandLink>
                                        <p:commandLink id="openInProjectSettingsButton"
                                                       rendered="#{focusViewBean.mainPanel.canOpenInProjectSettings()}"
                                                       styleClass="sideview-topbar-button"
                                                       action="#{navBean.redirectToActionUnitSettings(focusViewBean.mainPanel.unit)}"
                                                       title="#{langBean.msg('panel.header.settings')}">
                                            <h:outputText styleClass="bi bi-gear"/>
                                        </p:commandLink>
                                        <p:tooltip rendered="#{focusViewBean.mainPanel.canOpenInProjectSettings()}" autoHide="false" for="openInProjectSettingsButton" value="#{langBean.msg('panel.header.settings')}" position="bottom"/>

                                    </div>

                                </h:form>

                                <h:form id="actionForm-${focusViewBean.mainPanel.panelIndex}-head">
                                    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                                    <div style="display: flex;
                                    gap: 0.5em;
                                    align-items: center;
                                    flex-wrap: wrap;">
                                        <ui:include rendered="#{focusViewBean.mainPanel.displayHeader() != null}"
                                                    src="#{focusViewBean.mainPanel.displayHeader()}">
                                            <ui:param name="panelModel" value="#{focusViewBean.mainPanel}"/>
                                        </ui:include>
                                    </div>
                                </h:form>

                            </div>
                            <p:outputPanel id="panelContent" deferred="false" loaded="#{focusViewBean.mainPanel.loaded}"
                                           deferredMode="visible" styleClass="focus" style="min-height: 0">
                                <f:facet name="loading">
                                    <ui:include src="/pages/shared/panelLoadingSkeleton.xhtml"/>
                                </f:facet>
                                <p:ajax event="load" action="#{focusViewBean.mainPanel.loadData()}"
                                        update="panel-${focusViewBean.mainPanel.panelIndex}-container"/>
                                <ui:include src="/panel/panelContent.xhtml" id="panel-body">
                                    <ui:param name="mode" value="FOCUS"/>
                                    <ui:param name="panelModel" value="#{focusViewBean.mainPanel}"/>
                                    <ui:param name="panelIndex" value="#{focusViewBean.mainPanel.panelIndex}"/>
                                </ui:include>
                            </p:outputPanel>
                        </c:if>

                        <!--
                            Recording Unit main panel: FULL React panel — toolbar, header and Détails tab
                            for a single unit, or the list, depending on RecordingUnitPanel/
                            RecordingUnitListPanel.isReactPanelEnabled(). Mirrors overviewContent.xhtml's
                            React branch, bridged to focusViewBean.mainPanel directly instead of
                            panelModel.parentOrOverview. "Close" (single-unit only) means leaving the
                            focus page entirely (goBackUrl), not collapsing a slot, so it's a plain
                            redirect — no remoteCommand needed for it.

                            c:if, not rendered — see the comment on the JSF branch above; this branch's
                            own direct include of overviewContent.xhtml would otherwise collide with it.
                        -->
                        <c:if test="#{focusViewBean.mainPanel.reactPanelEnabled}">
                        <h:panelGroup style="display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;">
                            <h:form id="reactBridgeForm-main-${focusViewBean.mainPanel.panelIndexSafe}">
                                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                                <p:remoteCommand name="ruDuplicateMain_${focusViewBean.mainPanel.panelIndexSafe}"
                                                 action="#{focusViewBean.mainPanel.duplicate()}"
                                                 update="react-ru-main-container-${focusViewBean.mainPanel.panelIndex}"/>
                                <p:remoteCommand name="ruRefreshMain_${focusViewBean.mainPanel.panelIndexSafe}"
                                                 action="#{focusViewBean.mainPanel.refresh()}"
                                                 update="react-ru-main-container-${focusViewBean.mainPanel.panelIndex}"/>
                                <p:remoteCommand name="ruToggleBookmarkMain_${focusViewBean.mainPanel.panelIndexSafe}"
                                                 action="#{focusViewBean.mainPanel.togglePanelBookmark()}"
                                                 update="navBarCsrfForm:siamoisNavForm, subSidebarForm"/>
                                <!--
                                    List panel only: opens a row as the overview slot next to the list —
                                    the React equivalent of RecordingUnitTableViewModel.handleCommandLink's
                                    flowBean.addRecordingUnitToOverview. Targets the always-rendered
                                    overview wrapper below so PrimeFaces can reveal it even though it's
                                    currently not rendered (rendered="false" components can't self-update).
                                -->
                                <!--
                                    Both the wrapper AND the resizer must be in the update list: each has
                                    its own EL-computed display:none/visible style (keyed off
                                    parentOrOverview), evaluated at render time — a plain HTML <div> can't
                                    be a PrimeFaces update target at all, which is why the resizer below is
                                    an h:panelGroup, not a <div>, despite rendering identically.
                                -->
                                <p:remoteCommand name="ruOpenOverviewMain_${focusViewBean.mainPanel.panelIndexSafe}"
                                                 action="#{focusViewBean.openOverview(param.openId)}"
                                                 update="focus-overview-wrapper-${focusViewBean.mainPanel.panelIndex} focus-overview-resizer-${focusViewBean.mainPanel.panelIndex}">
                                    <f:param name="openId"/>
                                </p:remoteCommand>
                            </h:form>

                            <p:outputPanel id="react-ru-main-container-${focusViewBean.mainPanel.panelIndex}"
                                           style="height:100%;width:100%;min-width:0;display:flex;flex-direction:column;overflow:hidden;">
                                <link rel="stylesheet" href="#{request.contextPath}/resources/react-ru-panel/recording-unit-panel.css"/>
                                <div id="react-ru-main-${focusViewBean.mainPanel.panelIndex}" class="react-ru-main-root" style="height:100%;width:100%;min-width:0;overflow:auto;display:flex;flex-direction:column;"></div>
                                <script src="#{request.contextPath}/resources/react-ru-panel/recording-unit-panel.js"></script>

                                <h:panelGroup rendered="#{not focusViewBean.mainPanel.listPanel}">
                                    <script>
                                        (function () {
                                            var container = document.getElementById('react-ru-main-${focusViewBean.mainPanel.panelIndex}');
                                            if (container &amp;&amp; window.SiamoisRecordingUnitPanel) {
                                                window.SiamoisRecordingUnitPanel.unmount(container);
                                                window.SiamoisRecordingUnitPanel.mount(container, {
                                                    recordingUnitId: ${focusViewBean.mainPanel.unit.id},
                                                    csrfToken: '${_csrf.token}',
                                                    basePath: '${request.contextPath}',
                                                    bookmarked: ${focusViewBean.mainPanel.isBookmarked()},
                                                    actions: {
                                                        close: function () {
                                                            window.location.href = '#{not empty focusViewBean.mainPanel.goBackUrl ? focusViewBean.mainPanel.goBackUrl : "javascript:history.back()"}';
                                                        },
                                                        duplicate: function () { ruDuplicateMain_${focusViewBean.mainPanel.panelIndexSafe}(); },
                                                        refresh: function () { ruRefreshMain_${focusViewBean.mainPanel.panelIndexSafe}(); },
                                                        toggleBookmark: function () { ruToggleBookmarkMain_${focusViewBean.mainPanel.panelIndexSafe}(); }
                                                    }
                                                });
                                            }
                                        })();
                                    </script>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{focusViewBean.mainPanel.listPanel}">
                                    <script>
                                        (function () {
                                            var container = document.getElementById('react-ru-main-${focusViewBean.mainPanel.panelIndex}');
                                            if (container &amp;&amp; window.SiamoisRecordingUnitPanel) {
                                                window.SiamoisRecordingUnitPanel.unmountList(container);
                                                window.SiamoisRecordingUnitPanel.mountList(container, {
                                                    organizationId: ${sessionSettingsBean.selectedInstitution.id},
                                                    csrfToken: '${_csrf.token}',
                                                    basePath: '${request.contextPath}',
                                                    onRowOpen: function (id) { ruOpenOverviewMain_${focusViewBean.mainPanel.panelIndexSafe}({ openId: id }); }
                                                });
                                            }
                                        })();
                                    </script>
                                </h:panelGroup>
                            </p:outputPanel>
                        </h:panelGroup>

                        <p:blockUI block="panel-${focusViewBean.mainPanel.panelIndex}"
                                   widgetVar="buiPanel_${focusViewBean.mainPanel.panelIndex}">
                            <i class="pi pi-spin pi-spinner" style="font-size: 3rem"/>
                        </p:blockUI>
                        </c:if>
                    </h:panelGroup>

                    <!--
                        Overview pane, promoted to a true page-level sibling of the main panel (not
                        nested inside it) — only reached when the main panel is React-enabled; the JSF
                        branch above still renders its own overview via panelContent.xhtml's splitter,
                        unchanged, for every other panel type combination. Always rendered as a wrapper
                        (visibility toggled by CSS/inner rendered) so ruOpenOverviewMain's AJAX update can
                        reveal it — a component that starts with rendered="false" can't be PrimeFaces
                        `update` target. c:if around it (not rendered) for the same duplicate-id reason as
                        above — its own include of overviewContent.xhtml must not coexist in the tree with
                        the JSF branch's copy.
                    -->
                    <c:if test="#{focusViewBean.mainPanel.reactPanelEnabled}">
                    <!--
                        Drag handle mimicking p:splitter's gutter (bypassed for this React sibling-pane
                        layout — see the "sibling, not nested" architecture note earlier in this file).
                        Mirrors visibility with the panel below (both keyed off parentOrOverview) so
                        there's nothing to grab when there's no overview open.
                    -->
                    <style>
                        .focus-overview-resizer {
                            position: relative;
                            background: var(--surface-border, #dee2e6);
                            transition: background 0.1s ease-in-out;
                        }
                        .focus-overview-resizer:hover,
                        .focus-overview-resizer:active {
                            background: var(--main-color, #4a90d9);
                        }
                        /* Visible grip so the handle reads as draggable, not just a divider line. */
                        .focus-overview-resizer::after {
                            content: "";
                            position: absolute;
                            top: 50%;
                            left: 50%;
                            transform: translate(-50%, -50%);
                            width: 2px;
                            height: 28px;
                            border-radius: 2px;
                            background: rgba(0, 0, 0, 0.25);
                        }
                    </style>

                    <!--
                        h:panelGroup, not a plain <div>: it must be a real JSF component so
                        ruOpenOverviewMain's `update` (see above) can actually refresh its
                        display:none/visible style after opening an overview — a raw <div> can never be a
                        PrimeFaces AJAX update target.
                    -->
                    <h:panelGroup id="focus-overview-resizer-${focusViewBean.mainPanel.panelIndex}"
                                  layout="block"
                                  styleClass="focus-overview-resizer"
                                  style="#{empty focusViewBean.mainPanel.parentOrOverview ? 'display:none;' : 'flex:0 0 10px;width:10px;min-width:10px;flex-shrink:0;align-self:stretch;height:100%;cursor:col-resize;position:relative;z-index:5;'}"/>

                    <h:panelGroup id="focus-overview-wrapper-${focusViewBean.mainPanel.panelIndex}"
                                  layout="block"
                                  style="#{empty focusViewBean.mainPanel.parentOrOverview ? 'display:none;' : 'flex:0 0 420px;max-width:70%;min-width:240px;overflow:hidden;'}">
                        <ui:fragment rendered="#{not empty focusViewBean.mainPanel.parentOrOverview}">
                            <ui:include src="/panel/overviewContent.xhtml">
                                <ui:param name="panelModel" value="#{focusViewBean.mainPanel}"/>
                                <ui:param name="panelIndex" value="#{focusViewBean.mainPanel.panelIndex}"/>
                                <ui:param name="mode" value="FOCUS"/>
                            </ui:include>
                        </ui:fragment>
                    </h:panelGroup>

                    <script>
                        (function () {
                            var PANEL_ID = 'focus-overview-wrapper-${focusViewBean.mainPanel.panelIndex}';
                            var RESIZER_ID = 'focus-overview-resizer-${focusViewBean.mainPanel.panelIndex}';
                            var STORAGE_KEY = 'siamois-focus-overview-width';
                            var MIN_WIDTH = 240;

                            // Re-applied on every full page load (this script isn't part of the AJAX
                            // fragment that ruOpenOverviewMain updates, so a saved width doesn't survive
                            // opening the overview mid-session — acceptable, it's restored on next load).
                            var initialPanel = document.getElementById(PANEL_ID);
                            var savedWidth = window.localStorage.getItem(STORAGE_KEY);
                            if (savedWidth &amp;&amp; initialPanel &amp;&amp; initialPanel.style.display !== 'none') {
                                initialPanel.style.flexBasis = savedWidth + 'px';
                            }

                            if (window.__focusOverviewResizerWired) {
                                return;
                            }
                            window.__focusOverviewResizerWired = true;

                            var dragging = false;
                            var startX = 0;
                            var startWidth = 0;

                            document.addEventListener('mousedown', function (e) {
                                if (!e.target.closest || !e.target.closest('#' + RESIZER_ID)) {
                                    return;
                                }
                                var panel = document.getElementById(PANEL_ID);
                                if (!panel) {
                                    return;
                                }
                                dragging = true;
                                startX = e.clientX;
                                startWidth = panel.getBoundingClientRect().width;
                                document.body.style.userSelect = 'none';
                                e.preventDefault();
                            });

                            document.addEventListener('mousemove', function (e) {
                                if (!dragging) {
                                    return;
                                }
                                var panel = document.getElementById(PANEL_ID);
                                if (!panel) {
                                    return;
                                }
                                // Overview sits on the right: dragging left grows it, right shrinks it.
                                var delta = startX - e.clientX;
                                var next = Math.min(Math.max(startWidth + delta, MIN_WIDTH), window.innerWidth * 0.7);
                                panel.style.flexBasis = next + 'px';
                            });

                            document.addEventListener('mouseup', function () {
                                if (!dragging) {
                                    return;
                                }
                                dragging = false;
                                document.body.style.userSelect = '';
                                var panel = document.getElementById(PANEL_ID);
                                if (panel) {
                                    window.localStorage.setItem(STORAGE_KEY, Math.round(panel.getBoundingClientRect().width));
                                }
                            });
                        })();
                    </script>
                    </c:if>

                    </p:outputPanel>
                </h:panelGroup>
            </p:outputPanel>
        </p:outputPanel>
