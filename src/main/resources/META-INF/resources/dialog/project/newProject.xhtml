<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui" xmlns:h="http://java.sun.com/jsf/html"
             xmlns:f="http://java.sun.com/jsf/core">

    <!-- What makes the pickers of the dialog open their suggestions on focus, as the React pickers do:
         PrimeFaces only searches once something is typed. A picker that has just been picked from gets
         the focus back, and must not reopen. -->
    <script type="text/javascript">
        window.siaRefPicker = window.siaRefPicker || {
            pickedAt: {},
            open: function (widgetVar) {
                let widget = PF(widgetVar);
                if (!widget || widget.panel.is(':visible')) {
                    return;
                }
                let sincePick = Date.now() - (this.pickedAt[widgetVar] || 0);
                if (400 > sincePick) {
                    return;
                }
                widget.searchWithDropdown();
            },
            picked: function (widgetVar) {
                this.pickedAt[widgetVar] = Date.now();
            }
        };

        // The progress of the creation, shown while it runs: the default project reads its types and
        // vocabularies, which takes a while. The bar polls the bean on its own (ajax="true").
        window.siaNewProjectProgress = window.siaNewProjectProgress || {
            show: function (visible) {
                let panel = document.getElementById('newProjectProgress');
                if (panel) {
                    panel.hidden = !visible;
                }
            },
            start: function () {
                this.show(true);
                PF('newProjectProgressBar').start();
            },
            stop: function () {
                PF('newProjectProgressBar').cancel();
                this.show(false);
            }
        };
    </script>

    <!-- Same look as the create overlay of the React lists: a coloured top edge, the title with the
         entity's icon, each field with its label ABOVE it, a footer with the actions. -->
    <p:dialog widgetVar="newProjectDialog"
              id="newProjectDialog"
              showHeader="false"
              styleClass="sia-create-dialog"
              showEffect="fade"
              modal="true"
              resizable="false"
              closeOnEscape="true">
        <h:form id="newProjectForm">
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
            <div class="sia-create-form">
                <div class="sia-create-form-header">
                    <h4>#{langBean.msg('projectList.create')}</h4>
                </div>

                <div class="sia-create-form-body ui-fluid">
                    <div class="sia-create-form-field">
                        <p:outputLabel for="organisation" value="#{langBean.msg('common.entity.institution')}"
                                       styleClass="sia-create-form-label"/>
                        <p:selectOneMenu id="organisation" value="#{newProjectDialogBean.institutionId}" required="true">
                            <f:selectItems value="#{newProjectDialogBean.creatableInstitutions}" var="org"
                                           itemValue="#{org.id}" itemLabel="#{org.name}"/>
                            <p:ajax event="change" listener="#{newProjectDialogBean.onOrganisationChange()}" process="@this"
                                    update="type templateGroup identifier mainLocationGroup spatialContextGroup"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="sia-create-form-field">
                        <p:outputLabel for="name" value="#{langBean.msg('common.label.name')}"
                                       styleClass="sia-create-form-label"/>
                        <p:inputText id="name" value="#{newProjectDialogBean.name}" required="true" maxlength="100"/>
                    </div>

                    <div class="sia-create-form-field">
                        <p:outputLabel for="identifier" value="#{langBean.msg('common.label.identifier')}"
                                       styleClass="sia-create-form-label"/>
                        <p:inputText id="identifier" value="#{newProjectDialogBean.identifier}" maxlength="50"/>
                    </div>

                    <h:panelGroup id="templateGroup" rendered="#{newProjectDialogBean.templates.size() gt 1}" layout="block" styleClass="sia-create-form-field">
                        <p:outputLabel for="template" value="#{langBean.msg('projectList.create.template')}"
                                       styleClass="sia-create-form-label"/>
                        <p:selectOneMenu id="template" value="#{newProjectDialogBean.templateId}" filter="#{newProjectDialogBean.templates.size() gt 8}" filterMatchMode="contains">
                            <f:selectItems value="#{newProjectDialogBean.templates}" var="tpl"
                                           itemValue="#{tpl.id}" itemLabel="#{tpl.label}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <!-- The pickers below imitate the React ones of the data side (frontend/src/fields/renderers.tsx,
                         ResourceRefRenderer): no dropdown button, the suggestions open as soon as the field is
                         focused, each suggestion is described like there, and a picked place is a chip. -->
                    <h:panelGroup id="type" layout="block" styleClass="sia-create-form-field">
                        <p:outputLabel for="typeConcept" value="#{langBean.msg('projectList.create.type')}"
                                       styleClass="sia-create-form-label"/>
                        <p:autoComplete id="typeConcept" widgetVar="newProjectTypePicker"
                                        value="#{newProjectDialogBean.typeConcept}"
                                        completeMethod="#{newProjectDialogBean.completeType}"
                                        var="concept" itemValue="#{concept}"
                                        itemLabel="#{concept.conceptLabelToDisplay.label}"
                                        converter="#{conceptAutocompleteDTOConverter}"
                                        required="true" forceSelection="true"
                                        minQueryLength="0" scrollHeight="300"
                                        emptyMessage="#{langBean.msg('projectList.create.picker.noResult')}"
                                        styleClass="sia-ref-picker"
                                        panelStyleClass="sia-ref-picker-panel sia-ref-picker-panel-concept"
                                        onfocus="siaRefPicker.open('newProjectTypePicker')">
                            <p:ajax event="itemSelect" process="@this"
                                    onstart="siaRefPicker.picked('newProjectTypePicker')"/>
                            <p:column>
                                <ui:include src="/dialog/project/conceptChoiceItem.xhtml"/>
                            </p:column>
                        </p:autoComplete>
                    </h:panelGroup>

                    <!-- The place fields of the organisation's project form, as on the React create form: the
                         organisation's places, then the suggestions of the sources the field is configured with. -->
                    <h:panelGroup id="mainLocationGroup" layout="block">
                        <h:panelGroup rendered="#{newProjectDialogBean.placeFields.mainLocation ne null}" layout="block"
                                      styleClass="sia-create-form-field">
                            <p:outputLabel for="mainLocation" value="#{newProjectDialogBean.placeFields.mainLocation.label}"
                                           styleClass="sia-create-form-label"/>
                            <p:autoComplete id="mainLocation" widgetVar="newProjectMainLocationPicker"
                                            value="#{newProjectDialogBean.mainLocationPicks}"
                                            completeMethod="#{newProjectDialogBean.completeMainLocation}"
                                            var="place" itemValue="#{place}" itemLabel="#{place.name}"
                                            converter="#{newProjectDialogBean.offeredPlaces}"
                                            multiple="true" selectLimit="1" unique="true" forceSelection="true"
                                            minQueryLength="0" scrollHeight="300"
                                            emptyMessage="#{langBean.msg('projectList.create.picker.noResult')}"
                                            styleClass="sia-ref-picker sia-ref-picker-place"
                                            panelStyleClass="sia-ref-picker-panel"
                                            onfocus="siaRefPicker.open('newProjectMainLocationPicker')">
                                <p:ajax event="itemSelect" listener="#{newProjectDialogBean.onPlacePicked()}"
                                        process="@this" update="@this"
                                        onstart="siaRefPicker.picked('newProjectMainLocationPicker')"/>
                                <p:ajax event="itemUnselect" process="@this"/>
                                <p:column>
                                    <ui:include src="/dialog/project/placeChoiceItem.xhtml"/>
                                </p:column>
                                <f:facet name="footer">
                                    <h:panelGroup rendered="#{not empty newProjectDialogBean.mainLocationHint}">
                                        <small class="resource-ref-narrow-hint">#{newProjectDialogBean.mainLocationHint}</small>
                                    </h:panelGroup>
                                </f:facet>
                            </p:autoComplete>
                        </h:panelGroup>
                    </h:panelGroup>

                    <h:panelGroup id="spatialContextGroup" layout="block">
                        <h:panelGroup rendered="#{newProjectDialogBean.placeFields.spatialContext ne null}" layout="block"
                                      styleClass="sia-create-form-field">
                            <p:outputLabel for="spatialContext" value="#{newProjectDialogBean.placeFields.spatialContext.label}"
                                           styleClass="sia-create-form-label"/>
                            <p:autoComplete id="spatialContext" widgetVar="newProjectSpatialContextPicker"
                                            value="#{newProjectDialogBean.spatialContext}"
                                            completeMethod="#{newProjectDialogBean.completeSpatialContext}"
                                            var="place" itemValue="#{place}" itemLabel="#{place.name}"
                                            converter="#{newProjectDialogBean.offeredPlaces}"
                                            multiple="true" unique="true" forceSelection="true"
                                            minQueryLength="0" scrollHeight="300"
                                            emptyMessage="#{langBean.msg('projectList.create.picker.noResult')}"
                                            styleClass="sia-ref-picker sia-ref-picker-place"
                                            panelStyleClass="sia-ref-picker-panel"
                                            onfocus="siaRefPicker.open('newProjectSpatialContextPicker')">
                                <p:ajax event="itemSelect" listener="#{newProjectDialogBean.onPlacePicked()}"
                                        process="@this" update="@this"
                                        onstart="siaRefPicker.picked('newProjectSpatialContextPicker')"/>
                                <p:ajax event="itemUnselect" process="@this"/>
                                <p:column>
                                    <ui:include src="/dialog/project/placeChoiceItem.xhtml"/>
                                </p:column>
                                <f:facet name="footer">
                                    <h:panelGroup rendered="#{not empty newProjectDialogBean.spatialContextHint}">
                                        <small class="resource-ref-narrow-hint">#{newProjectDialogBean.spatialContextHint}</small>
                                    </h:panelGroup>
                                </f:facet>
                            </p:autoComplete>
                        </h:panelGroup>
                    </h:panelGroup>

                    <div id="newProjectProgress" class="sia-create-form-progress" hidden="hidden">
                        <small class="sia-create-form-hint">#{langBean.msg('projectList.create.inProgress')}</small>
                        <p:progressBar id="creationProgress" widgetVar="newProjectProgressBar"
                                       ajax="true" interval="500" global="false"
                                       value="#{newProjectDialogBean.progress.percentage}"
                                       labelTemplate="{value}%"/>
                    </div>
                </div>

                <div class="sia-create-form-footer">
                    <p:commandButton value="#{langBean.msg('common.action.cancel')}" type="button"
                                     styleClass="ui-button-flat" onclick="PF('newProjectDialog').hide()"/>
                    <p:commandButton value="#{langBean.msg('common.action.create')}"
                                     actionListener="#{newProjectDialogBean.create()}"
                                     process="@form" update="@form :projectListDatatable:formCC:projectListForm"
                                     onstart="siaNewProjectProgress.start()"
                                     oncomplete="siaNewProjectProgress.stop(); if (args &amp;&amp; args.created) PF('newProjectDialog').hide()"/>
                </div>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
