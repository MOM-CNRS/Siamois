<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://java.sun.com/jsf/core"
>
    <!-- html2canvas-pro: drop-in fork of html2canvas that understands modern CSS colors (color-mix, oklch,
         color()), which the original 1.4.1 rejects, making every capture fail. -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"
            integrity="sha384-QbVSYhU9faw2C7l92rI0Dmke8Yod6KaOixC1kkbO/dGnMDKtbWhwcxSSOkmHXWom"
            crossorigin="anonymous"></script>
    <h:outputScript library="js" name="feedback.js"/>

    <style>
        .sia-feedback-label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-700, #444);
        }
        .sia-feedback-optional, .sia-feedback-required {
            font-weight: 400;
            font-size: 0.78rem;
        }
        .sia-feedback-optional {
            color: var(--gray-500, #888);
        }
        .sia-feedback-required {
            color: #c0392b;
        }
        .sia-feedback-input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 0.6rem;
        }
        .sia-feedback-dialog .ui-dialog-content {
            padding-top: 0.5rem;
        }
        @keyframes sia-feedback-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .sia-feedback-spin {
            display: inline-block;
            animation: sia-feedback-spin 0.8s linear infinite;
        }
    </style>

    <h:form id="feedbackCreateForm">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <!-- Dedicated growl, fed from the callback params of the remote command (see feedback.js), with HTML
             escaping disabled so the GitHub issue link renders as a real link — the app-wide growl keeps
             escaping everything else. -->
        <p:growl id="feedbackGrowl" widgetVar="feedbackGrowlVar" escape="false" closable="true"/>

        <p:dialog widgetVar="feedbackCreateDiag" id="feedbackCreateDiag" showEffect="fade"
                  closeOnEscape="true" appendToBody="true" modal="true" width="460" resizable="false"
                  styleClass="ui-panel siamois-panel sia-feedback-dialog">

            <f:facet name="header">
                <span style="display:flex;align-items:center;gap:0.5rem;">
                    <i class="bi bi-camera" style="color:var(--main-color, #2e7d32);"></i>
                    Nouveau retour
                </span>
            </f:facet>

            <div style="display:flex;flex-direction:column;gap:1rem;">

                <div id="siaFeedbackCaptureStatus"
                     style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.75rem;
                             background:var(--siamois-green-light-100, #eaf5ec);border-radius:6px;
                             font-size:0.85rem;color:var(--gray-700, #444);">
                    <i class="bi bi-check-circle-fill" style="color:var(--main-color, #2e7d32);"></i>
                    <span style="flex:1;">Capture d'écran jointe</span>
                    <a href="#" onclick="PF('feedbackCreateDiag').hide();siaFeedbackStartCapture();return false;"
                       style="font-size:0.8rem;white-space:nowrap;">
                        Refaire
                    </a>
                </div>

                <div>
                    <label for="feedbackCreateForm:feedbackNameInput" class="sia-feedback-label">
                        Votre nom <span class="sia-feedback-optional">(optionnel)</span>
                    </label>
                    <input type="text" id="feedbackCreateForm:feedbackNameInput"
                           name="feedbackCreateForm:feedbackNameInput"
                           class="ui-inputfield ui-widget ui-state-default ui-corner-all sia-feedback-input"
                           maxlength="128"/>
                </div>

                <div>
                    <label for="feedbackCreateForm:feedbackDescriptionInput" class="sia-feedback-label">
                        Description <span class="sia-feedback-required">*</span>
                    </label>
                    <textarea id="feedbackCreateForm:feedbackDescriptionInput"
                              name="feedbackCreateForm:feedbackDescriptionInput" rows="5"
                              placeholder="Décrivez ce que vous avez constaté..."
                              class="ui-inputfield ui-widget ui-state-default ui-corner-all sia-feedback-input"
                              style="resize:vertical;"/>
                </div>

            </div>

            <f:facet name="footer">
                <button type="button" id="feedbackCancelBtn" class="ui-button ui-widget ui-state-default ui-corner-all"
                        style="padding:0.4em 1.2em;" onclick="PF('feedbackCreateDiag').hide();">
                    Annuler
                </button>
                <button type="button" id="feedbackSendBtn" class="ui-button ui-widget ui-state-default ui-corner-all"
                        style="padding:0.4em 1.2em;background:var(--main-color, #2e7d32);color:#fff;border-color:var(--main-color, #2e7d32);"
                        onclick="siaFeedbackSubmit();">
                    <i class="bi bi-send" style="margin-right:0.4em;"></i>Envoyer
                </button>
            </f:facet>
        </p:dialog>

        <p:remoteCommand name="siaSubmitFeedbackRemote"
                          action="#{feedbackBean.saveFeedbackFromRequest}"
                          process="@this"
                          oncomplete="siaFeedbackOnSendComplete(xhr, status, args);"/>
    </h:form>
</ui:fragment>
