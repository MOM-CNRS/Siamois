<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui" xmlns:h="http://java.sun.com/jsf/html"
             xmlns:f="http://java.sun.com/jsf/core"

>


    <script>
        const institutionFunnyMessages = [
            "#{langBean.msg('organisationManagement.creating.funny.1')}",
            "#{langBean.msg('organisationManagement.creating.funny.2')}",
            "#{langBean.msg('organisationManagement.creating.funny.3')}",
            "#{langBean.msg('organisationManagement.creating.funny.4')}",
            "#{langBean.msg('organisationManagement.creating.funny.5')}",
            "#{langBean.msg('organisationManagement.creating.funny.6')}",
            "#{langBean.msg('organisationManagement.creating.funny.7')}",
            "#{langBean.msg('organisationManagement.creating.funny.8')}",
            "#{langBean.msg('organisationManagement.creating.funny.9')}",
            "#{langBean.msg('organisationManagement.creating.funny.10')}",
            "#{langBean.msg('organisationManagement.creating.funny.11')}",
            "#{langBean.msg('organisationManagement.creating.funny.12')}",
            "#{langBean.msg('organisationManagement.creating.funny.13')}",
            "#{langBean.msg('organisationManagement.creating.funny.14')}",
            "#{langBean.msg('organisationManagement.creating.funny.15')}",
            "#{langBean.msg('organisationManagement.creating.funny.16')}"
        ];
        let institutionFunnyMessageInterval = null;

        function nextInstitutionFunnyMessage() {
            const label = document.getElementById('institutionFunnyMessage');
            if (!label) return;
            const choices = institutionFunnyMessages.filter(msg => msg !== label.dataset.current);
            const next = choices[Math.floor(Math.random() * choices.length)];
            label.dataset.current = next;
            label.textContent = next;
        }

        function startInstitutionProgressBar() {
            const bars = document.getElementsByClassName('institution-progress-bar');
            for (const bar of bars) {
                bar.style.visibility = 'visible';
            }
            PF('pbAjaxInstitutionCreateWidget').start();
            nextInstitutionFunnyMessage();
            institutionFunnyMessageInterval = setInterval(nextInstitutionFunnyMessage, 5000);
        }

        function endInstitutionProgressBar() {
            const bars = document.getElementsByClassName('institution-progress-bar');
            for (const bar of bars) {
                bar.style.visibility = 'collapse';
            }
            PF('pbAjaxInstitutionCreateWidget').cancel();
            clearInterval(institutionFunnyMessageInterval);
        }
    </script>

    <!-- Same look as the new-project dialog and the React create overlay: a coloured top edge, the
         title with the entity's icon, each field with its label ABOVE it, a footer with the actions. -->
    <p:dialog
            widgetVar="newInstitutionDialog"
            id="newInstitutionDialog"
            showHeader="false"
            styleClass="sia-create-dialog"
            showEffect="fade"
            modal="true"
            closable="false"
    >
        <h:form>
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
            <div class="sia-create-form">
                <div class="sia-create-form-header">
                    <h4>#{institutionDialogBean.title}</h4>
                </div>

                <div class="sia-create-form-body ui-fluid">
                    <div class="sia-create-form-field">
                        <p:outputLabel for="name" value="#{langBean.msg('organisationManagement.orgName')}"
                                       styleClass="sia-create-form-label"/>
                        <p:inputText
                                required="true"
                                placeholder="#{langBean.msg('common.placeholder.institution')}"
                                id="name"
                                widgetVar="nameW"
                                value="#{institutionDialogBean.institutionName}"
                                maxlength="50"
                        >
                            <p:ajax event="keyup" delay="300" oncomplete="updateSlugFromName()" />
                        </p:inputText>
                    </div>

                    <div class="sia-create-form-field">
                        <p:outputLabel for="identifier" value="#{langBean.msg('common.label.identifier')}"
                                       styleClass="sia-create-form-label"/>
                        <p:inputText
                                required="true"
                                id="identifier"
                                widgetVar="slugW"
                                placeholder="#{langBean.msg('common.placeholder.institutionCode')}"
                                value="#{institutionDialogBean.identifier}"
                                oninput="markSlugDirty()"
                        >
                            <f:validateRegex pattern="^[a-z0-9]+(-[a-z0-9]+)*$"/>
                        </p:inputText>
                        <small id="slugHelp" class="sia-create-form-hint">
                            Lettres, chiffres et tirets uniquement, en minuscules.
                        </small>
                    </div>

                    <div class="sia-create-form-field">
                        <p:outputLabel for="thesaurus" value="Adresse du serveur de Opentheso"
                                       styleClass="sia-create-form-label"/>
                        <div class="sia-create-form-inline">
                            <p:inputText
                                    required="true"
                                    placeholder="ex: https://thesaurus.mom.fr"
                                    id="thesaurus"
                                    value="#{institutionDialogBean.thesaurusServerUrl}"
                                    styleClass="#{institutionDialogBean.thesaurusError ? 'ui-state-error' : ''}"
                            />
                            <p:commandButton id="reload-info-list"
                                             icon="bi bi-arrow-counterclockwise"
                                             styleClass="ui-button-outlined"
                                             action="#{institutionDialogBean.reloadThesaurusInfoList()}"
                                             update="thesaurus-selection-menu"
                                             process="@this thesaurus-selection-menu thesaurus"
                            />
                        </div>
                    </div>

                    <div class="sia-create-form-field">
                        <p:outputLabel for="thesaurus-selection-menu" value="Sélection du thésaurus *"
                                       styleClass="sia-create-form-label"/>
                        <p:autoComplete
                                id="thesaurus-selection-menu"
                                value="#{institutionDialogBean.selected}"
                                completeMethod="#{institutionDialogBean.completeFromInput}"
                                var="publicThesoInfo"
                                itemLabel="#{publicThesoInfo.label()} (#{publicThesoInfo.idTheso()})"
                                itemValue="#{publicThesoInfo}"
                                forceSelection="true"
                                converter="#{thesaurusInfoConverter}"
                                dropdown="true"
                                scrollHeight="300"
                        />
                    </div>

                    <div class="sia-create-form-field">
                        <p:outputLabel for="description" value="#{langBean.msg('common.label.description')}"
                                       styleClass="sia-create-form-label"/>
                        <p:inputTextarea
                                id="description"
                                value="#{institutionDialogBean.description}"
                                rows="3"
                        />
                    </div>

                    <p id="institutionFunnyMessage"
                       class="institution-progress-bar sia-create-form-hint"
                       style="visibility: collapse; margin: 0;"
                    />

                    <p:progressBar widgetVar="pbAjaxInstitutionCreateWidget"
                                   id="pbAjaxInstitutionCreate"
                                   ajax="true"
                                   value="#{institutionDialogBean.progressWrapper.progressPercentage}"
                                   labelTemplate="{value}%"
                                   styleClass="institution-progress-bar"
                                   global="true"
                                   interval="500"
                                   style="visibility: collapse"
                    />
                </div>

                <div class="sia-create-form-footer">
                    <p:commandButton value="#{langBean.msg('common.action.cancel')}"
                                     styleClass="ui-button-flat"
                                     immediate="true" action="#{institutionDialogBean.exit()}" update="@form"/>
                    <p:commandButton value="#{institutionDialogBean.buttonLabel}"
                                     action="#{institutionDialogBean.save()}"
                                     update="@form institutionManagerDatatable:formCC:institutionManagerForm"
                                     onstart="startInstitutionProgressBar()"
                                     oncomplete="endInstitutionProgressBar()"/>
                </div>
            </div>
        </h:form>
    </p:dialog>

</ui:fragment>
