<!-- reactPanelMount.xhtml -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!--@elvariable id="panelModel" type="fr.siamois.ui.bean.panel.models.panel.AbstractPanel"-->

    <!--
    The mount div React attaches to (plan §7.2/§8 phase 8), included by focus.xhtml.
    Everything here is HTML-attribute-escaped by Facelets, never interpolated into a JS string —
    resources/js/reactPanelBootstrap.js (a plain static file, no EL) reads it all back off
    container.dataset.
    -->
    <div id="react-main-panel-mount-${panelModel.panelIndex}"
         class="react-main-panel-mount"
         style="flex: 1; min-height: 0; display: flex; flex-direction: column;"
         data-panel-index="#{panelModel.panelIndex}"
         data-panel-kind="#{panelModel.reactPanelKind()}"
         data-entity-type="#{panelModel.reactEntityType()}"
         data-entity-id="#{panelModel.reactEntityId()}"
         data-organization-id="#{panelModel.reactOrganizationId()}"
         data-overview-entity-type="#{panelModel.parentOrOverview != null ? panelModel.parentOrOverview.reactEntityType() : ''}"
         data-overview-entity-id="#{panelModel.parentOrOverview != null ? panelModel.parentOrOverview.reactEntityId() : ''}"
         data-overview-organization-id="#{panelModel.parentOrOverview != null ? panelModel.parentOrOverview.reactOrganizationId() : ''}"
         data-write-mode="#{flowBean.isWriteMode}"
         data-go-back-url="#{panelModel.goBackUrl}"
         data-base-path="#{request.contextPath}"
         data-csrf-header="${_csrf.headerName}"
         data-csrf-token="${_csrf.token}"
         data-main-resource-uri="#{panelModel.ressourceUri()}"
         data-main-title="#{panelModel.resolveTitleOrTitleCode()}"
         data-main-bookmarked="#{panelModel.isBookmarked()}"
         data-overview-resource-uri="#{panelModel.parentOrOverview != null ? panelModel.parentOrOverview.ressourceUri() : ''}"
         data-overview-title="#{panelModel.parentOrOverview != null ? panelModel.parentOrOverview.resolveTitleOrTitleCode() : ''}"
         data-overview-bookmarked="#{panelModel.parentOrOverview != null ? panelModel.parentOrOverview.isBookmarked() : false}"
         data-action-duplicate="reactAction_duplicate_${panelModel.jsPanelIndex}"
         data-action-create="reactAction_create_${panelModel.jsPanelIndex}"
         data-action-settings="reactAction_settings_${panelModel.jsPanelIndex}"
         data-action-list-create="reactAction_listCreate_${panelModel.jsPanelIndex}"
         data-action-set-overview="reactAction_setOverview_${panelModel.jsPanelIndex}"
         data-overview-action-close-overview="reactAction_overview_closeOverview_${panelModel.jsPanelIndex}"
         data-overview-action-duplicate="reactAction_overview_duplicate_${panelModel.jsPanelIndex}"
         data-overview-action-create="reactAction_overview_create_${panelModel.jsPanelIndex}"
         data-overview-action-settings="reactAction_overview_settings_${panelModel.jsPanelIndex}"
    ></div>

</ui:composition>
