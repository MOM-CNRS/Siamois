<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:chip="http://xmlns.jcp.org/jsf/composite/pages/shared/chip" xmlns:h="http://java.sun.com/jsf/html"
             xmlns:c="http://java.sun.com/jsp/jstl/core"
>
    <!--@elvariable id="panelModel" type="fr.siamois.ui.bean.panel.models.panel.single.RecordingUnitPanel"-->


        <c:if test="#{panelModel.hasPreviousNext()}">
            <ui:include src="/panel/header/validationButton.xhtml">
                <ui:param name="disabled" value="false"/>
                <ui:param name="unit" value="#{panelModel.unit}"/>
                <ui:param name="panelModel" value="#{panelModel}"/>
            </ui:include>
        </c:if>
        <div style="display: flex;">

            <p:commandLink id="previous"
                           process="@this"
                           rendered="#{panelModel.hasPreviousNext()}"
                           action="#{panelModel.goToPrevious()}"
                           styleClass="sideview-topbar-button">
                <h:outputText styleClass='ui-icon bi bi-caret-up' style="color: var(--main-color)"/>
            </p:commandLink>
            <p:tooltip
                    autoHide="false" value="Fiche précédente"
                    position="bottom"
                    for="previous"
            />
            <p:commandLink id="next"
                           process="@this"
                           rendered="#{panelModel.hasPreviousNext()}"
                           action="#{panelModel.goToNext()}"
                           styleClass="sideview-topbar-button">
                <h:outputText styleClass='ui-icon bi bi-caret-down' style="color: var(--main-color)"/>
            </p:commandLink>
            <p:tooltip
                    autoHide="false" value="Fiche suivante"
                    position="bottom"
                    for="next"
            />

        </div>


    <h:panelGroup id="idChipArea" styleClass="mr-2">
        <h:panelGroup rendered="#{not panelModel.editingIdentifier}" styleClass="chip-cell-wrapper">
            <p:chip label="#{panelModel.unit != null ? panelModel.unit.fullIdentifier : panelModel.titleCodeOrTitle}"
                    icon="#{panelModel.icon}"
                    id="idChip"
                    styleClass="recording-unit-chip-alt entity-nav-chip"
            />
            <div class="chip-cell-actions">
                <p:commandButton id="editIdentifierBtn"
                                 rendered="#{flowBean.isWriteMode}"
                                 icon="bi bi-pencil"
                                 styleClass="rum-edit-id-btn"
                                 action="#{panelModel.startEditIdentifier()}"
                                 update="idChipArea"
                                 process="@this"
                                 oncomplete="$('.rum-edit-link-input').trigger('focus').trigger('select');"/>
                <p:tooltip for="editIdentifierBtn" value="Modifier l'identifiant" position="top"/>
            </div>
        </h:panelGroup>
        <h:panelGroup rendered="#{panelModel.editingIdentifier}" styleClass="chip-cell-wrapper">
            <p:inputText id="editIdentifierInput"
                         value="#{panelModel.editingIdentifierValue}"
                         styleClass="rum-edit-link-input"
                         style="min-width: 8em;"
                         onkeydown="if(event.key==='Enter'){event.preventDefault();$(this).siblings('.rum-apply-link-edit-btn').trigger('click');}else if(event.key==='Escape'){event.preventDefault();$(this).siblings('.rum-cancel-link-edit-btn').trigger('click');}"/>
            <p:commandButton id="applyIdentifierBtn"
                             icon="bi bi-check"
                             styleClass="rum-action-btn rum-apply-link-edit-btn"
                             title="Valider"
                             action="#{panelModel.applyEditIdentifier()}"
                             update="idChipArea"
                             process="editIdentifierInput @this"/>
            <p:commandButton id="cancelIdentifierBtn"
                             icon="bi bi-x"
                             styleClass="rum-action-btn rum-cancel-link-edit-btn"
                             title="Annuler"
                             action="#{panelModel.cancelEditIdentifier()}"
                             update="idChipArea"
                             process="@this"/>
        </h:panelGroup>
    </h:panelGroup>
    <h:form id="contextMenuForm" styleClass="sia-settings-form">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
        <p:contextMenu for="idChip">
            <p:menuitem value="Ouvrir dans l'aperçu lateral" icon="bi bi-layout-sidebar-inset-reverse"
                        action="#{flowBean.addRecordingUnitToOverview(
                    panelModel.unit.id,
                    panelModel,
                    1
            )}"
            />
        </p:contextMenu>
    </h:form>

    <chip:conceptChip concept="#{panelModel.unit.type}" styleClass="mr-2 recording-unit-type-chip"/>


    <p:chip rendered="#{panelModel.hasUnsavedModifications}" label="Modifications non enregistré"
            styleClass="mr-2 error-chip"
    />

    <div id="spinner" style="display:none;" class="spinner-border">
        <output class="visually-hidden">Loading...</output>
    </div>

</ui:fragment>
