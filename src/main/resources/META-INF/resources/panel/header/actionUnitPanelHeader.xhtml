<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:chip="http://xmlns.jcp.org/jsf/composite/pages/shared/chip"
>
    <!--@elvariable id="panelModel" type="fr.siamois.ui.bean.panel.models.panel.single.ActionUnitPanel"-->


    <p:chip label="#{panelModel.unit != null ? panelModel.unit.name : panelModel.titleCodeOrTitle}"
            styleClass="mr-2 action-unit-chip-alt"
            icon="#{panelModel.icon}"
    />

    <chip:editableIdentifierChip panel="#{panelModel}"
                                  value="#{panelModel.unit != null ? panelModel.unit.fullIdentifier : ''}"
                                  styleClass="action-unit-chip-alt"
                                  icon="bi bi-hash"/>


    <chip:conceptChip concept="#{panelModel.unit.type}" styleClass="mr-2 action-unit-type-chip"/>

    <p:chip rendered="#{not empty panelModel.unit.mainLocation}" label="#{panelModel.unit.mainLocation.name}"
            styleClass="mr-2 action-unit-type-chip" icon="bi bi-geo-alt"
    />

    <p:chip rendered="#{panelModel.hasUnsavedModifications}" label="Modifications non enregistré"
            styleClass="mr-2 error-chip"
    />

    <div id="spinner" style="display:none;" class="spinner-border">
        <output class="visually-hidden">Loading...</output>
    </div>

</ui:fragment>
