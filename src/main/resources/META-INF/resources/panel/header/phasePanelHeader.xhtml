<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:chip="http://xmlns.jcp.org/jsf/composite/pages/shared/chip"
             xmlns:panelui="http://xmlns.jcp.org/jsf/composite/pages/shared/panel"
             xmlns:h="http://java.sun.com/jsf/html"
>
    <!--@elvariable id="panelModel" type="fr.siamois.ui.bean.panel.models.panel.single.PhasePanel"-->

    <div style="display: flex;">
        <p:commandLink id="previous"
                       process="@this"
                       rendered="#{panelModel.hasPreviousNext()}"
                       action="#{panelModel.goToPrevious()}"
                       styleClass="sideview-topbar-button">
            <h:outputText styleClass='ui-icon bi bi-caret-up' style="color: var(--main-color)"/>
        </p:commandLink>
        <p:tooltip autoHide="false" value="Fiche précédente" position="bottom" for="previous"/>
        <p:commandLink id="next"
                       process="@this"
                       rendered="#{panelModel.hasPreviousNext()}"
                       action="#{panelModel.goToNext()}"
                       styleClass="sideview-topbar-button">
            <h:outputText styleClass='ui-icon bi bi-caret-down' style="color: var(--main-color)"/>
        </p:commandLink>
        <p:tooltip autoHide="false" value="Fiche suivante" position="bottom" for="next"/>
    </div>

    <chip:editableIdentifierChip id="idChipComposite" panel="#{panelModel}"
                                  value="#{panelModel.unit != null ? panelModel.unit.identifier : panelModel.titleCodeOrTitle}"
                                  styleClass="phase-chip-alt"
                                  icon="#{panelModel.icon}"/>

    <chip:editableCategoryChip id="categoryChipComposite" panel="#{panelModel}"/>

    <panelui:headerEditControls id="headerEditControlsComposite" panel="#{panelModel}"/>

    <p:chip
            label="#{panelModel.unit.createdBy.displayName()}"
            icon="bi bi-person"
            styleClass="mr-2 phase-type-chip"/>

    <p:chip rendered="#{panelModel.hasUnsavedModifications}" label="Modifications non enregistré"
            styleClass="mr-2 error-chip"
    />

    <div id="spinner" style="display:none;" class="spinner-border">
        <output class="visually-hidden">Loading...</output>
    </div>

</ui:fragment>
