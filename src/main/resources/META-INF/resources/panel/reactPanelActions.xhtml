<!-- reactPanelActions.xhtml -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html">

    <!--@elvariable id="panelModel" type="fr.siamois.ui.bean.panel.models.panel.AbstractPanel"-->

    <!--
    The few things React still needs the JSF session for, as plain global JS functions via
    p:remoteCommand. None of them is bound to the entity JSF mounted with the page: each takes the
    target as a remoteCommand param, so they keep working after React navigated client-side. Every
    other toolbar action (bookmark, create, duplicate) is a REST call from React, gated on the
    entity's own _permissions — which is what keeps the toolbar visible after a navigation.

    Function names are suffixed by panelIndex so multiple open panel instances never collide; the
    mount div's data-action-* attributes (reactPanelMount.xhtml) name these exact functions for the
    bootstrap script to look up on `window`.
    -->
    <h:form id="reactPanelActionsForm-${panelModel.panelIndex}">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <!--
        Project settings: a server-side mode switch + redirect (NavBean#redirectToActionUnitSettings),
        not something REST can do. Called as reactAction_openProjectSettings_N({projectId: ...});
        React only shows the button when the project's _permissions.canManageSettings is true, and
        the bean re-checks it anyway.
        -->
        <p:remoteCommand name="reactAction_openProjectSettings_${panelModel.jsPanelIndex}"
                          action="#{navBean.redirectToActionUnitSettingsFromRequest()}"
                          process="@this"
                          update="@none"/>

        <!--
        Keeps FlowBean's parentOrOverview in sync with a client-side-opened overview (plan §8 phase
        5), for F5 and the navigation history. Takes the target entity type and id as remoteCommand
        params (reactAction_setOverview_N({entityType: ..., id: ...})) — see
        FlowBean#addEntityToOverviewFromRequest. Fire-and-forget: nothing in React waits on it.
        -->
        <p:remoteCommand name="reactAction_setOverview_${panelModel.jsPanelIndex}"
                          action="#{flowBean.addEntityToOverviewFromRequest(panelModel)}"
                          process="@this"
                          update="@none"/>

        <!-- Same sync as above, for closing the overview. -->
        <p:remoteCommand name="reactAction_overview_closeOverview_${panelModel.jsPanelIndex}"
                          action="#{panelModel.closeOverview()}"
                          process="@this"
                          update="@none"/>
    </h:form>

</ui:composition>
