<!-- reactPanelActions.xhtml -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html">

    <!--@elvariable id="panelModel" type="fr.siamois.ui.bean.panel.models.panel.AbstractPanel"-->

    <!--
    The few things React still needs the JSF session for, as plain global JS functions via
    p:remoteCommand. None of them is bound to the entity JSF mounted with the page: each takes the
    target as a remoteCommand param, so they keep working after React navigated client-side. Every
    other toolbar action (bookmark, create, duplicate) is a REST call from React, gated on the
    entity's own _permissions — which is what keeps the toolbar visible after a navigation.

    The form's id and the function names are fixed, on purpose: the view is rebuilt on every postback
    from the main panel of that moment, so anything derived from it would no longer match what the
    page rendered as soon as React moved the main pane, and the server would silently drop the call.
    The mount div's data-action-* attributes (reactPanelMount.xhtml) name these exact functions for
    the bootstrap script to look up on `window`.
    -->
    <h:form id="reactPanelActionsForm">
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <!--
        Keeps FlowBean's parentOrOverview in sync with a client-side-opened overview (plan §8 phase
        5), for F5 and the navigation history. Takes the target entity type and id as remoteCommand
        params (reactAction_setOverview({entityType: ..., id: ...})) — see
        FlowBean#addEntityToOverviewFromRequest. Fire-and-forget: nothing in React waits on it.
        -->
        <p:remoteCommand name="reactAction_setOverview"
                          action="#{flowBean.addEntityToOverviewFromRequest(panelModel)}"
                          process="@this"
                          global="false"
                          update="@none"/>

        <!-- Same sync as above, for closing the overview. -->
        <p:remoteCommand name="reactAction_overview_closeOverview"
                          action="#{panelModel.closeOverview()}"
                          process="@this"
                          global="false"
                          update="@none"/>

        <!--
        A client-side navigation of the React main pane (reactAction_setMain({path: "/action-unit/12", fullScreen: true})):
        FocusViewBean#setMainFromRequest moves the view's main panel to it and, when `fullScreen` says
        a fiche was just opened there, records it in the history. Fire-and-forget, like the other two.

        This refreshes the sidebar's history list (focus.xhtml, .sia-history-table) itself: a jQuery
        selector, so nothing happens while the sidebar shows the bookmarks instead.
        -->
        <p:remoteCommand name="reactAction_setMain"
                          action="#{focusViewBean.setMainFromRequest()}"
                          process="@this"
                          global="false"
                          update="@(.sia-history-table)"
                          oncomplete="revealCurrentHistoryEntry()"/>

        <!--
        A bookmark added or removed by React (REST): only the sidebar's bookmarks list needs
        redrawing (focus.xhtml, .sia-bookmarks-table) — its lazy model reloads on render.
        -->
        <p:remoteCommand name="reactAction_refreshBookmarks"
                          process="@this"
                          global="false"
                          update="@(.sia-bookmarks-table)"/>

        <!--
        A view created, renamed or updated by React (REST): only the sidebar's views list needs
        redrawing (focus.xhtml, .sia-views-table) — its lazy model reloads on render.
        -->
        <p:remoteCommand name="reactAction_refreshViews"
                          process="@this"
                          global="false"
                          update="@(.sia-views-table)"/>
    </h:form>

</ui:composition>
