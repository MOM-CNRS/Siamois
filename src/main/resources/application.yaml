#######################
# Server Configuration
#######################
server:
  port: ${SIAMOIS_PORT:8099}
  forward-headers-strategy: native
  servlet:
    context-path: ${CONTEXT_PATH:/siamois}
    session:
      timeout: 125m
  error:
    path: /error/500
    whitelabel:
      enabled: false

siamois:
  lang:
    default: ${DEFAULT_LANG:fr}
    available: en, fr
  admin:
    username: ${SIAMOIS_ADMIN_LOGIN}
    password: ${SIAMOIS_ADMIN_PASSWORD}
    email: ${SIAMOIS_ADMIN_EMAIL}
  documents:
    folder-path: ${SIAMOIS_DOCUMENTS_PATH}
    allowed-types: "*/*"
  # The standard type of each table of a new project, as a concept of the system thesaurus (its OpenTheso
  # URI): "UE standard", "Mobilier standard"… Recording units also start with US and F. An empty URI means
  # the table starts without a standard type and its types are added from the project settings.
  default-types:
    ue: ${SIAMOIS_DEFAULT_TYPE_UE:https://thesaurus.mom.fr/?idc=4291162&idt=th252}
    mobilier: ${SIAMOIS_DEFAULT_TYPE_MOBILIER:https://thesaurus.mom.fr/?idc=4291163&idt=th252}
    phase: ${SIAMOIS_DEFAULT_TYPE_PHASE:https://thesaurus.mom.fr/?idc=4291164&idt=th252}
    contenant: ${SIAMOIS_DEFAULT_TYPE_CONTENANT:https://thesaurus.mom.fr/?idc=4291165&idt=th252}
    document: ${SIAMOIS_DEFAULT_TYPE_DOCUMENT:https://thesaurus.mom.fr/?idc=4291166&idt=th252}
  jwt:
    # HS256 : au moins 256 bits — utiliser une valeur forte en prod (variable SIAMOIS_JWT_SECRET).
    secret: ${SIAMOIS_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    access-token-validity: PT15M
  feedback:
    github:
      token: ${SIAMOIS_GITHUB_FEEDBACK_TOKEN:}
      repository: MOM-CNRS/Siamois
      label: feedback
      screenshot-branch: feedback-screenshots
      issues-url: https://github.com/MOM-CNRS/Siamois/issues?q=is%3Aissue+label%3Afeedback


spring:
  thymeleaf:
    check-template-location: false
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 1000
      minimum-idle: 1
      idle-timeout: 30000
      connection-test-query: SELECT 1
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        jdbc:
          batch_size: 50
        # Lazy relations and eager references of a whole list page load in one IN (...) query per
        # relation instead of one query per row: a page of finds cost ~217 index scans per row
        # (recording units ~45) before this.
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
        envers:
          audit_table_suffix: _AUD
          store_data_at_delete: true
          global_with_modified_flag: true

  liquibase:
    enabled: true
    change-log: classpath:/changelog/db.changelog.xml

  messages:
    basename: language/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    resources:
      static-locations: classpath:/static/

  servlet:
    multipart:
      enabled: true
      max-file-size: 8MB
      max-request-size: 8MB
  cache:
    caffeine:
      spec: expireAfterAccess=1h,maximumSize=500

  mail:
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH_ENABLED:true}
        sender: ${EMAIL_SENDER_ADDRESS}
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}

joinfaces:
  faces:
    project-stage: production
  primefaces:
    theme: overcast

logging:
  level:
    root: INFO
    org:
      springframework: INFO
      hibernate:
        SQL: INFO

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  default-produces-media-type: application/json

