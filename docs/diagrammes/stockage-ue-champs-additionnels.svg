<text x="910" y="350" class="k">PK</text>
<text x="938" y="350" class="r">(fk_custom_field_id, fk_form_config_answer_id)</text>
<text x="938" y="372" class="r">answer_type  (discriminant, table unique)</text>
<text x="938" y="394" class="r">value_as_text · value_as_integer</text>
<text x="938" y="416" class="r">value_as_decimal · value_as_boolean</text>
<text x="938" y="438" class="r">value_as_datetime</text>
<text x="938" y="460" class="r">value_as_double + value_comment + fk_unit_id  (mesure)</text>
<text x="938" y="482" class="r">has_been_modified</text>
