<text x="40" y="598" class="g">Valeurs multiples ou références : une table de jointure par type de cible</text>
<text x="40" y="620" class="n">custom_field_answer existe une seule fois (clé = champ + fiche) ; chaque valeur choisie est une ligne de plus ici.</text>
