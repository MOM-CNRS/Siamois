<text x="60" y="1000" class="g">Exemple : l'US 12 avec trois champs additionnels</text>
<text x="60" y="1024" class="n">form_config_answer 301  =  (recording_unit 12, form_config « US » du projet 5)</text>
<text x="60" y="1060" class="g">custom_field_answer</text>
<text x="60" y="1086" class="k">fk_custom_field_id</text>
<text x="230" y="1086" class="k">fk_form_config_answer_id</text>
<text x="410" y="1086" class="k">answer_type</text>
<text x="560" y="1086" class="k">valeur</text>
<text x="60" y="1112" class="r">7 « Poids »</text>
<text x="230" y="1112" class="r">301</text>
<text x="410" y="1112" class="r">MEASUREMENT</text>
<text x="560" y="1112" class="r">value_as_double = 109,  fk_unit_id = g</text>
<text x="60" y="1138" class="r">9 « Inclusions »</text>
<text x="230" y="1138" class="r">301</text>
<text x="410" y="1138" class="r">SELECT_MULTIPLE</text>
<text x="560" y="1138" class="r">aucune colonne de valeur (voir ci-contre)</text>
<text x="60" y="1164" class="r">11 « Observations »</text>
<text x="230" y="1164" class="r">301</text>
<text x="410" y="1164" class="r">TEXT</text>
<text x="560" y="1164" class="r">value_as_text = « mortier rose »</text>
<text x="60" y="1210" class="n">Un champ, une fiche : une seule ligne ici. Le type de réponse décide des colonnes utilisées.</text>
<text x="60" y="1232" class="n">Un champ à valeur multiple n'a donc pas de colonnes : ses valeurs sont dans la jointure.</text>
<text x="1000" y="1060" class="g">custom_field_answer_concept_answers</text>
<text x="1000" y="1086" class="k">fk_custom_field_id</text>
<text x="1170" y="1086" class="k">fk_form_config_answer_id</text>
<text x="1340" y="1086" class="k">fk_concept_id</text>
<text x="1000" y="1112" class="r">9</text>
<text x="1170" y="1112" class="r">301</text>
<text x="1340" y="1112" class="r">« gravier »</text>
<text x="1000" y="1138" class="r">9</text>
<text x="1170" y="1138" class="r">301</text>
<text x="1340" y="1138" class="r">« charbon »</text>
<text x="1000" y="1164" class="r">9</text>
<text x="1170" y="1164" class="r">301</text>
<text x="1340" y="1164" class="r">« tuile »</text>
<text x="1000" y="1210" class="n">« Inclusions contient charbon » : filtrer sur (champ, réponse), puis fk_concept_id.</text>
<text x="1000" y="1232" class="n">Ajouter ou retirer une valeur ne touche pas à la ligne de custom_field_answer.</text>
</svg>