.t{font-size:15px;font-weight:700;fill:#fff}.r{font-size:13px;fill:#222}.k{font-size:11px;font-weight:700;fill:#888}
.c{font-size:12px;font-weight:700;fill:#333}.n{font-size:13px;fill:#444}.h{font-size:26px;font-weight:700;fill:#111}.s{font-size:14px;fill:#555}
