<rect width="1600" height="1330" fill="#fafaf7"/>
<text x="40" y="48" class="h">SIAMOIS · Stockage des fiches (UE…) et des valeurs des champs additionnels</text>
<text x="40" y="74" class="s">Les colonnes de la fiche ne portent que les champs système. Tout champ additionnel est une ligne de réponse, rattachée à la fiche par un « form_config_answer ».</text>
<rect x="40" y="190" width="310" height="176" rx="8" fill="#fff" stroke="#2f6fb0" stroke-width="2"/>
<path d="M40 224 V198 a8 8 0 0 1 8 -8 H342 a8 8 0 0 1 8 8 V224 Z" fill="#2f6fb0"/>
<text x="52" y="213" class="t">recording_unit  (UE)</text>
<text x="50" y="240" class="k">PK</text>
<text x="78" y="240" class="r">recording_unit_id</text>
<text x="78" y="262" class="r">full_identifier</text>
<text x="78" y="284" class="r">fk_type → concept</text>
<text x="78" y="306" class="r">fk_action_unit_id → projet</text>
<text x="78" y="328" class="r">geom, taq, tpq, comments…</text>
<text x="78" y="350" class="r">(colonnes système uniquement)</text>
<rect x="40" y="440" width="310" height="110" rx="8" fill="#fff" stroke="#2f6fb0" stroke-width="2"/>
<path d="M40 474 V448 a8 8 0 0 1 8 -8 H342 a8 8 0 0 1 8 8 V474 Z" fill="#2f6fb0"/>
<text x="52" y="463" class="t">autres entités</text>
<text x="78" y="490" class="r">specimen · phase · container</text>
<text x="78" y="512" class="r">document · study</text>
<text x="78" y="534" class="r">même schéma : colonnes système seulement</text>
<rect x="430" y="100" width="380" height="154" rx="8" fill="#fff" stroke="#3b8a5a" stroke-width="2"/>
<path d="M430 134 V108 a8 8 0 0 1 8 -8 H802 a8 8 0 0 1 8 8 V134 Z" fill="#3b8a5a"/>
<text x="442" y="123" class="t">form_config  (le formulaire)</text>
<text x="440" y="150" class="k">PK</text>
<text x="468" y="150" class="r">config_id</text>
<text x="468" y="172" class="r">fk_action_unit_id  → le projet</text>
<text x="468" y="194" class="r">fk_field_concept_id → champ type (SIARU.TYPE…)</text>
<text x="468" y="216" class="r">fk_value_concept_id → valeur du type (null = défaut)</text>
<text x="468" y="238" class="r">identifier_format, min_code, max_code</text>
<rect x="430" y="300" width="380" height="198" rx="8" fill="#fff" stroke="#c4731c" stroke-width="2"/>
<path d="M430 334 V308 a8 8 0 0 1 8 -8 H802 a8 8 0 0 1 8 8 V334 Z" fill="#c4731c"/>
<text x="442" y="323" class="t">form_config_answer  (fiche × formulaire)</text>
<text x="440" y="350" class="k">PK</text>
<text x="468" y="350" class="r">form_config_answer_id</text>
<text x="440" y="372" class="k">FK</text>
<text x="468" y="372" class="r">fk_form_config_id</text>
<text x="468" y="394" class="r">fk_recording_unit_id</text>
<text x="468" y="416" class="r">fk_specimen_id · fk_phase_id</text>
<text x="468" y="438" class="r">fk_container_id · fk_document_id · fk_study_id</text>
<text x="468" y="460" class="r">→ une seule de ces colonnes est renseignée</text>
<text x="468" y="482" class="r">UNIQUE (entité, form_config)</text>
<rect x="900" y="100" width="420" height="154" rx="8" fill="#fff" stroke="#7a4fa3" stroke-width="2"/>
<path d="M900 134 V108 a8 8 0 0 1 8 -8 H1312 a8 8 0 0 1 8 8 V134 Z" fill="#7a4fa3"/>
<text x="912" y="123" class="t">custom_field  (la définition du champ)</text>
<text x="910" y="150" class="k">PK</text>
<text x="938" y="150" class="r">custom_field_id</text>
<text x="938" y="172" class="r">answer_type  (TEXT, SELECT_MULTIPLE, MEASUREMENT…)</text>
<text x="938" y="194" class="r">label, hint, value_binding</text>
<text x="938" y="216" class="r">field_code, is_system_field</text>
<text x="938" y="238" class="r">fk_concept, fk_unit, fk_nature, fk_measurement_type</text>
